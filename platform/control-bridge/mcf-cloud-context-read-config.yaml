result_protocol: MCF_CLOUD_CONTEXT_READ_RESULT_V1
enable_environment:
  name: MCF_CLOUD_CONTEXT_READ_ENABLE
  value: DISPOSABLE_LOCAL_LAB_ONLY
project_id: cloud-infrastructure
