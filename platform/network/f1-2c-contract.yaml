    - CR-020
    - CR-034
  binding_invariants:
    - INV-002
    - INV-003
    - INV-007
  threat_controls:
    - TM-02
    - TM-03
    - TM-10
scope:
  address_families:
    - ipv4
    - ipv6
  workload_scopes:
    - tenant
    - project
    - mission
    - sandbox
  protected_zones:
    - host
    - management
    - metadata
    - control
  selected_mechanisms:
    docker_firewall_backend: iptables
    host_frontend: iptables-nft
    policy_entry_chain: DOCKER-USER
    owned_chain: CLOUD-PLATFORM-FWD
