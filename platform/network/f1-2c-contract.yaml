api_version: cloud-platform/v1alpha1
kind: NetworkEnforcementContract
metadata:
  slice: F1.2c
  environment: DEV_LAB
  status: TECHNOLOGY_SELECTED_REPO_ONLY
  operational_state: NOT_APPLIED
  technology_selection: DOCKER_IPTABLES_NFT_DOCKER_USER_INTERNAL_BRIDGES_PROXY_EGRESS
authority:
