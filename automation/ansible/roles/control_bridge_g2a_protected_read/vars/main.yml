  environment=test
  node=node-01
  bundle_sha256=fa262ac3ab509a549da98b6613d43da56ed0a0b6452585a2de5bfdc3fbfd0aef
g2a_protected_marker_sha256_dev: a7c8d0958f82c749a7502dd1ab96fe0098e5ac53121fec6fa51d4819f5335d90
g2a_protected_marker_sha256_test: 19eaed875ff2942ede023b77a9b6a4739196aea8919d26611d0981d6d67dbe97

