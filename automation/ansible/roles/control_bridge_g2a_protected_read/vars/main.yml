---
# Immutable G2-A protected-reader installation contract. This role owns only
# its private bundle, fixed entrypoint, sudoers fragment, install lock, marker.
g2a_protected_service_account: mcf-workspace
g2a_protected_service_home: /nonexistent
g2a_protected_service_shell: /usr/sbin/nologin
g2a_protected_workspace_path: /var/lib/mcf-control-bridge/workspaces/leon337/g2a-smoke/dev
g2a_protected_readme_path: /var/lib/mcf-control-bridge/workspaces/leon337/g2a-smoke/dev/README.md

g2a_protected_bundle_root: /usr/local/lib/mcf-control-bridge-g2a-protected
g2a_protected_bundle_sha256: fa262ac3ab509a549da98b6613d43da56ed0a0b6452585a2de5bfdc3fbfd0aef
g2a_protected_entrypoint_path: /usr/local/libexec/mcf-control-g2a-protected-read
g2a_protected_sudoers_path: /etc/sudoers.d/mcf-control-g2a-protected-read
g2a_protected_marker_path: /etc/mcf-control-g2a-protected-read.managed
g2a_protected_install_lock: /run/lock/mcf-control-g2a-protected-read-install

g2a_protected_marker_content_dev: |-
  managed_by=cloud-infrastructure
  slice=CONTROL-BRIDGE-G2A-PROTECTED-READ
  schema=1
  environment=dev
  node=node-01
  bundle_sha256=fa262ac3ab509a549da98b6613d43da56ed0a0b6452585a2de5bfdc3fbfd0aef
