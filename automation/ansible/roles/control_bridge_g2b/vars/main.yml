---
# Immutable CONTROL-BRIDGE-G2B installation contract. Role vars intentionally
# outrank inventory and extra vars so a caller cannot redirect reviewed paths.
g2b_service_account: mcf-workspace
g2b_service_comment: MCF protected workspace executor
g2b_service_home: /nonexistent
g2b_service_shell: /usr/sbin/nologin

g2b_executor_bundle_root: /usr/local/lib/mcf-control-bridge
g2b_executor_bundle_sha256: 35ba49c0919764d78381a121e1882fac60a9925a69d861cc7da4ca042d461255
g2b_entrypoint_path: /usr/local/libexec/mcf-control-g2b
g2b_sudoers_path: /etc/sudoers.d/mcf-control-g2b
g2b_tmpfiles_path: /etc/tmpfiles.d/mcf-control-bridge-g2b.conf
g2b_grant_path: /etc/mcf-control-bridge/g2b-grant.json
g2b_marker_path: /etc/mcf-control-bridge-g2b.managed
g2b_workspace_path: /var/lib/mcf-control-bridge/workspaces/leon337/g2a-smoke/dev
g2b_state_path: /var/lib/mcf-control-bridge/state/g2b
g2b_log_path: /var/log/mcf-control-bridge/g2b
g2b_lock_path: /run/lock/mcf-control-bridge-g2b.lock
g2b_pilot_path: G2B-PILOT.txt

g2b_marker_content_dev: |-
  managed_by=cloud-infrastructure
  slice=CONTROL-BRIDGE-G2B
  schema=1
  environment=dev
  node=node-01
  bundle_sha256=35ba49c0919764d78381a121e1882fac60a9925a69d861cc7da4ca042d461255
g2b_marker_content_test: |-
  managed_by=cloud-infrastructure
  slice=CONTROL-BRIDGE-G2B
  schema=1
  environment=test
  node=node-01
  bundle_sha256=35ba49c0919764d78381a121e1882fac60a9925a69d861cc7da4ca042d461255
g2b_marker_sha256_dev: f022794207fe0ac723f52438896f32c51d4b457e0a7375eb8c27945b05026c9d
g2b_marker_sha256_test: 6643d0bb956efea416f9e19fa942a5e73b50177276a840dd89dc5a350768ae33

g2b_root_directories:
  - {path: /usr/local/libexec, owner: root, group: root, mode: "0755"}
  - {path: /usr/local/lib/mcf-control-bridge, owner: root, group: root, mode: "0755"}
  - {path: /usr/local/lib/mcf-control-bridge/control_plane, owner: root, group: root, mode: "0755"}
  - {path: /usr/local/lib/mcf-control-bridge/control_plane/g2b, owner: root, group: root, mode: "0755"}
  - {path: /etc/mcf-control-bridge, owner: root, group: root, mode: "0755"}
  - {path: /var/lib/mcf-control-bridge, owner: root, group: root, mode: "0755"}
  - {path: /var/lib/mcf-control-bridge/workspaces, owner: root, group: root, mode: "0755"}
  - {path: /var/lib/mcf-control-bridge/workspaces/leon337, owner: root, group: root, mode: "0755"}
  - {path: /var/lib/mcf-control-bridge/workspaces/leon337/g2a-smoke, owner: root, group: root, mode: "0755"}
  - {path: /var/lib/mcf-control-bridge/state, owner: root, group: root, mode: "0755"}
  - {path: /var/log/mcf-control-bridge, owner: root, group: root, mode: "0755"}

g2b_service_directories:
  - {path: /var/lib/mcf-control-bridge/workspaces/leon337/g2a-smoke/dev, owner: mcf-workspace, group: mcf-workspace, mode: "0700"}
  - {path: /var/lib/mcf-control-bridge/state/g2b, owner: mcf-workspace, group: mcf-workspace, mode: "0700"}
  - {path: /var/log/mcf-control-bridge/g2b, owner: mcf-workspace, group: mcf-workspace, mode: "0700"}

# Parents shared with the base OS or other CONTROL-BRIDGE slices may already
# exist before the external G2-B provenance marker. They may be reused only
# when their exact reviewed owner/group/mode already matches the directory
# contract. G2-B-exclusive leaves are intentionally absent from this list.
g2b_preexisting_shared_directory_paths:
  - /usr/local/libexec
  - /usr/local/lib/mcf-control-bridge
  - /usr/local/lib/mcf-control-bridge/control_plane
  - /etc/mcf-control-bridge
  - /var/lib/mcf-control-bridge
  - /var/lib/mcf-control-bridge/workspaces
  - /var/lib/mcf-control-bridge/workspaces/leon337
  - /var/lib/mcf-control-bridge/workspaces/leon337/g2a-smoke
  - /var/lib/mcf-control-bridge/state
  - /var/log/mcf-control-bridge

