---
platform_docker_marker: /etc/cloud-platform-docker-runtime.managed
platform_docker_state_root: /var/lib/cloud-platform/runtime-boundaries/docker
platform_docker_prestate: /var/lib/cloud-platform/runtime-boundaries/docker/prestate.json
platform_docker_transaction: /var/lib/cloud-platform/runtime-boundaries/docker/transaction.json
platform_docker_tree_baseline: /var/lib/cloud-platform/runtime-boundaries/docker/runtime-tree-baseline.json
platform_docker_removal_manifest: /var/lib/cloud-platform/runtime-boundaries/docker/runtime-tree-removal.json
platform_docker_lock: /run/lock/cloud-platform-docker-runtime-operation

platform_docker_daemon_config: /etc/docker/daemon.json
platform_docker_apt_key: /etc/apt/keyrings/docker.asc
platform_docker_apt_source: /etc/apt/sources.list.d/docker.sources
platform_docker_apt_preference: /etc/apt/preferences.d/cloud-platform-docker.pref
platform_docker_service_override: /etc/systemd/system/docker.service.d/10-cloud-platform-boundary.conf
platform_docker_socket_override: /etc/systemd/system/docker.socket.d/10-cloud-platform-root-only.conf
platform_containerd_service_override: /etc/systemd/system/containerd.service.d/10-cloud-platform-boundary.conf

platform_docker_managed_directories:
  - /etc/docker
  - /etc/systemd/system/docker.service.d
  - /etc/systemd/system/docker.socket.d
  - /etc/systemd/system/containerd.service.d

platform_docker_shared_parent_directories:
  - /etc/apt/keyrings
  - /etc/apt/sources.list.d
  - /etc/apt/preferences.d

platform_docker_runtime_roots:
  - /var/lib/docker
  - /var/lib/containerd

platform_docker_conflicting_packages:
  - docker.io
  - docker-doc
  - docker-compose
  - podman-docker
  - containerd
  - runc
  - docker-ce-rootless-extras

