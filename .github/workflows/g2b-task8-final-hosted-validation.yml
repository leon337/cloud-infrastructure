name: g2b-task8-final-hosted-validation

on:
  pull_request:
    branches:
      - codex/control-bridge-g2b
    paths:
      - .github/workflows/g2b-task8-final-hosted-validation.yml
      - automation/ansible/roles/control_bridge_g2b/tasks/main.yml

permissions:
  contents: read

jobs:
  final-validation:
    if: >-
      github.actor == 'leon337' &&
      github.event.pull_request.number == 21 &&
      github.event.pull_request.head.ref == 'team/g2b-task8-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Run repository and focused regression
        run: |
          set -Eeuo pipefail
          echo "G2B_TASK8_FINAL_CANDIDATE=$(git rev-parse HEAD)"
          scripts/test.sh
          echo G2B_TASK8_REPOSITORY_VALIDATION_PASS
          python3 -m unittest tests.test_g2b_disposable_integration -v
          echo G2B_TASK8_FOCUSED_REGRESSION_PASS
          bash -n scripts/test_control_bridge_g2b_vm.sh
          echo G2B_TASK8_HARNESS_SYNTAX_PASS

      - name: Prove complete lifecycle in hosted disposable boundary
        env:
          G2B_TEST_PRIVILEGED_CONFIRM: DISPOSABLE_UBUNTU_24_04_ONLY
          G2B_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          scripts/test_control_bridge_g2b_vm.sh | tee /tmp/g2b-task8-final.log
          echo G2B_TASK8_FINAL_LIFECYCLE_EXIT=0
          for marker in \
            G2B_DISPOSABLE_IDENTITY_PASS \
            G2B_TRANSPORT_DIRECT_WRITE_REFUSED \
            G2B_GRANT_24H_PASS \
            G2B_WRITE_PASS \
            G2B_REPLAY_PASS \
            G2B_REQUEST_ID_CONFLICT_PASS \
            G2B_CONCURRENCY_PASS \
            G2B_AUDIT_PASS \
            G2B_ROLLBACK_PASS \
            G2B_FINAL_STATE_PASS \
            G2B_REVOKE_PASS \
            G2B_POST_REVOKE_REFUSAL_PASS \
            G2B_BOUNDED_CLEANUP_PASS; do
            test "$(grep -c -x "$marker" /tmp/g2b-task8-final.log)" -eq 1
          done
          echo G2B_TASK8_ALL_ACCEPTANCE_MARKERS_PASS
          echo NO_G2B_NODE01_WRITE=PASS
