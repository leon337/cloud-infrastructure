name: mcf-open-browser-once

on:
  push:
    branches:
      - ops/open-browser-vps-20260822

permissions:
  contents: read
  issues: write

jobs:
  open-browser:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Open Firefox in active VPS desktop session
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          report() {
            body="$1"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/11/comments" \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"body":sys.argv[1]}))' "$body")" \
              >/dev/null || true
          }

          echo "MCF_BROWSER_OPEN_START"
          uid="$(id -u)"
          user="$(id -un)"
          host="$(hostname)"
          session_pid="$(pgrep -u "$uid" -n xfce4-session || true)"
          if [ -z "$session_pid" ]; then
            session_pid="$(pgrep -u "$uid" -n xfce4-panel || true)"
          fi
          if [ -z "$session_pid" ]; then
            report "MCF_BROWSER_OPEN_RESULT=FAIL_NO_ACTIVE_XFCE_SESSION\nHOST=$host USER=$user"
            exit 21
          fi

          env_dump="$(tr '\0' '\n' < "/proc/$session_pid/environ")"
          display="$(printf '%s\n' "$env_dump" | sed -n 's/^DISPLAY=//p' | head -n1)"
          dbus="$(printf '%s\n' "$env_dump" | sed -n 's/^DBUS_SESSION_BUS_ADDRESS=//p' | head -n1)"
          xdg="$(printf '%s\n' "$env_dump" | sed -n 's/^XDG_RUNTIME_DIR=//p' | head -n1)"
          xauth="$(printf '%s\n' "$env_dump" | sed -n 's/^XAUTHORITY=//p' | head -n1)"
          home="$(printf '%s\n' "$env_dump" | sed -n 's/^HOME=//p' | head -n1)"

          if [ -z "$display" ]; then
            report "MCF_BROWSER_OPEN_RESULT=FAIL_NO_DISPLAY\nHOST=$host USER=$user XFCE_PID=$session_pid"
            exit 22
          fi
          if ! command -v firefox >/dev/null 2>&1; then
            report "MCF_BROWSER_OPEN_RESULT=FAIL_FIREFOX_MISSING\nHOST=$host USER=$user DISPLAY=$display"
            exit 23
          fi

          : "${home:=$HOME}"
          : "${xauth:=$home/.Xauthority}"
          : "${xdg:=/run/user/$uid}"

          setsid env \
            DISPLAY="$display" \
            DBUS_SESSION_BUS_ADDRESS="$dbus" \
            XDG_RUNTIME_DIR="$xdg" \
            XAUTHORITY="$xauth" \
            HOME="$home" \
            firefox --new-window about:blank \
            >/tmp/mcf-open-browser.log 2>&1 </dev/null &

          browser_pid=$!
          report "MCF_BROWSER_OPEN_RESULT=DISPATCHED\nHOST=$host USER=$user DISPLAY=$display XFCE_PID=$session_pid LAUNCH_PID=$browser_pid"
          echo "MCF_BROWSER_OPEN_DISPATCHED"
