name: hermes-operator-runtime

on:
  push:
    branches:
      - mcf/hermes-relay-bootstrap-20260823

permissions:
  contents: write

concurrency:
  group: hermes-operator-runtime-node01
  cancel-in-progress: true

jobs:
  provision-and-probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 30
    env:
      HOME: /home/ubuntu
      PATH: /home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin
      DISPLAY: ':10'
      XAUTHORITY: /home/ubuntu/.Xauthority
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
      MODEL_ID: qwen3.5-2b
      MODEL_HF: openresearchtools/Qwen3.5-2B-GGUF:Q4_K_M

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: mcf/hermes-relay-bootstrap-20260823
          fetch-depth: 0

      - name: Verify unprivileged boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = ubuntu
          if sudo -n true 2>/dev/null; then
            echo 'REFUSED unexpected passwordless sudo' >&2
            exit 1
          fi
          test -x "$HOME/.local/bin/hermes"
          test -x "$HOME/.local/bin/llama"
          "$HOME/.local/bin/hermes" --version | head -1
          "$HOME/.local/bin/hermes" computer-use doctor

      - name: Stop stale local inference requests and server
        shell: bash
        run: |
          set -euo pipefail
          pkill -u "$(id -u)" -f 'curl .*127\.0\.0\.1:8080/v1/chat/completions' 2>/dev/null || true
          pkill -u "$(id -u)" -f '/home/ubuntu/.local/bin/llama serve' 2>/dev/null || true
          sleep 3
          ! pgrep -f '/home/ubuntu/.local/bin/llama serve' >/dev/null

      - name: Start Qwen3.5 2B local provider
        shell: bash
        run: |
          set -euo pipefail
          base="$HOME/.local/share/mcf-hermes-local-provider"
          mkdir -p "$base"
          rm -f "$base/server.log"
          env -u RUNNER_TRACKING_ID nohup "$HOME/.local/bin/llama" serve \
            -hf "$MODEL_HF" \
            -c 65536 \
            --cache-type-k q4_0 \
            --cache-type-v q4_0 \
            --jinja \
            --reasoning off \
            --host 127.0.0.1 \
            --port 8080 \
            --alias "$MODEL_ID" \
            --no-webui \
            > "$base/server.log" 2>&1 < /dev/null &
          echo $! > "$base/llama.pid"
          echo "LLAMA_PID=$(cat "$base/llama.pid")"

      - name: Wait for local provider
        shell: bash
        run: |
          set -euo pipefail
          base="$HOME/.local/share/mcf-hermes-local-provider"
          for i in $(seq 1 180); do
            code=$(curl -sS -o /tmp/hermes-health -w '%{http_code}' --max-time 2 http://127.0.0.1:8080/health || true)
            if [[ "$code" == 200 ]]; then
              echo LOCAL_PROVIDER_HEALTH=PASS
              cat /tmp/hermes-health
              exit 0
            fi
            if [[ -f "$base/llama.pid" ]] && ! kill -0 "$(cat "$base/llama.pid")" 2>/dev/null; then
              echo LOCAL_PROVIDER_EXITED >&2
              tail -n 160 "$base/server.log" >&2 || true
              exit 1
            fi
            sleep 5
          done
          echo LOCAL_PROVIDER_HEALTH=TIMEOUT >&2
          tail -n 160 "$base/server.log" >&2 || true
          exit 1

      - name: Verify OpenAI-compatible tool calling
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          timeout 180 curl -fsS http://127.0.0.1:8080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen3.5-2b","messages":[{"role":"user","content":"Call the readiness tool with value HERMES_READY."}],"tools":[{"type":"function","function":{"name":"readiness","description":"Record readiness","parameters":{"type":"object","properties":{"value":{"type":"string"}},"required":["value"]}}}],"tool_choice":"required","temperature":0,"max_tokens":48}' > "$tmp"
          python3 - "$tmp" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1]))
          calls=obj['choices'][0]['message'].get('tool_calls') or []
          if not calls:
              print(json.dumps(obj)[:3000])
              raise SystemExit('TOOL_CALLING=FAIL')
          call=calls[0]['function']
          print('TOOL_CALLING=PASS')
          print('TOOL_NAME='+call.get('name',''))
          print('TOOL_ARGS='+call.get('arguments',''))
          if call.get('name') != 'readiness':
              raise SystemExit('unexpected tool name')
          PY
          rm -f "$tmp"

      - name: Configure Hermes custom local provider
        shell: bash
        run: |
          set -euo pipefail
          py="$HOME/.hermes/hermes-agent/.venv/bin/python"
          "$py" - <<'PY'
          from pathlib import Path
          import os,tempfile,yaml
          p=Path('/home/ubuntu/.hermes/config.yaml')
          cfg=yaml.safe_load(p.read_text()) if p.exists() else {}
          if not isinstance(cfg,dict): cfg={}
          model=cfg.get('model')
          if not isinstance(model,dict): model={}
          model.update({
              'default':'qwen3.5-2b',
              'provider':'custom',
              'base_url':'http://127.0.0.1:8080/v1',
              'api_key':'no-key',
              'context_length':65536,
          })
          cfg['model']=model
          fd,tmp=tempfile.mkstemp(prefix='config.',suffix='.yaml',dir=str(p.parent)); os.close(fd)
          Path(tmp).write_text(yaml.safe_dump(cfg,sort_keys=False,allow_unicode=True))
          os.chmod(tmp,0o600); os.replace(tmp,p)
          print('HERMES_PROVIDER_CONFIG=PASS')
          PY
          "$HOME/.local/bin/hermes" config get model --json

      - name: Cognitive smoke without GUI
        shell: bash
        run: |
          set -euo pipefail
          out=$(timeout 240 "$HOME/.local/bin/hermes" -z 'Reply with exactly HERMES_READY and nothing else.' --ignore-rules)
          printf 'HERMES_SMOKE_OUTPUT=%s\n' "$out"
          test "$out" = HERMES_READY
          echo HERMES_COGNITIVE_SMOKE=PASS

      - name: Computer Use smoke
        shell: bash
        run: |
          set -euo pipefail
          out=$(timeout 300 "$HOME/.local/bin/hermes" -z 'Use the computer_use tool exactly once to observe the current Linux desktop. Do not click or type. Then reply with exactly GUI_PROBE_OK.' -t computer_use --ignore-rules)
          printf 'GUI_SMOKE_OUTPUT=%s\n' "$out"
          test "$out" = GUI_PROBE_OK
          echo HERMES_COMPUTER_USE_SMOKE=PASS

      - name: Collect sanitized evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/hermes-relay-bootstrap
          out=artifacts/hermes-relay-bootstrap/runtime-status.txt
          {
            echo "UTC=$(date -u +%FT%TZ)"
            echo "HOST=$(hostname)"
            echo "RUNNER_USER=$(id -un)"
            echo "SENTINELX_ACTIVE=$(systemctl is-active sentinelx-cloud-core 2>/dev/null || true)"
            echo "MODEL=$MODEL_ID"
            echo "LOCAL_PROVIDER_HEALTH=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8080/health || true)"
            echo "LLAMA_PROCESS=$(pgrep -af '/home/ubuntu/.local/bin/llama serve' | head -1 || true)"
            echo "HERMES_VERSION=$($HOME/.local/bin/hermes --version 2>/dev/null | head -1 || true)"
            echo "RELAY_SOCKET=$([[ -S /tmp/mcf-hermes-relay.sock ]] && echo yes || echo no)"
            echo "MEM=$(free -h | awk '/Mem:/{print $3" used, "$7" available"}')"
            echo "DISK=$(df -h / | awk 'NR==2{print $3" used, "$4" available"}')"
          } > "$out"
          cat "$out"

      - name: Persist sanitized evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mcf-hermes-runtime'
          git config user.email 'mcf-hermes-runtime@users.noreply.github.com'
          git add artifacts/hermes-relay-bootstrap/runtime-status.txt
          git commit -m 'chore: record Hermes operator runtime status [skip ci]' || exit 0
          git pull --rebase origin mcf/hermes-relay-bootstrap-20260823
          git push origin HEAD:mcf/hermes-relay-bootstrap-20260823
