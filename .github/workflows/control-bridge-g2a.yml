name: control-bridge-g2a

on:
  push:
    branches:
      - mcf/mission-001-control-bridge-g1
    paths:
      - control/dispatch/g2a.json

permissions:
  contents: read
  issues: write

concurrency:
  group: control-bridge-g2a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10

    steps:
      - name: Check out exact G2-A state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Create isolated Python environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/g2a-venv"
          "${RUNNER_TEMP}/g2a-venv/bin/pip" install \
            --disable-pip-version-check \
            --no-cache-dir \
            -r requirements-dev.lock

      - name: Execute bounded read-only request
        env:
          CONTROL_BRIDGE_EVENT_NAME: ${{ github.event_name }}
        run: |
          "${RUNNER_TEMP}/g2a-venv/bin/python" scripts/control_bridge_g2a.py \
            --event-name "${CONTROL_BRIDGE_EVENT_NAME}" \
            --event-path "${GITHUB_EVENT_PATH}" \
            --dispatch-file control/dispatch/g2a.json \
            --envelope-file "${RUNNER_TEMP}/g2a-envelope.json" \
            --result-file "${RUNNER_TEMP}/g2a-result.json" \
            --attachment-file "${RUNNER_TEMP}/g2a-attachment.bin"

      - name: Upload bounded attachment when present
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: g2a-${{ github.run_id }}
          path: ${{ runner.temp }}/g2a-attachment.bin
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish compact result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "${RUNNER_TEMP}/g2a-venv/bin/python" scripts/control_bridge_g2a_publish.py \
            --envelope-file "${RUNNER_TEMP}/g2a-envelope.json" \
            --result-file "${RUNNER_TEMP}/g2a-result.json" \
            --attachment-file "${RUNNER_TEMP}/g2a-attachment.bin" \
            --summary-file "${GITHUB_STEP_SUMMARY}"
