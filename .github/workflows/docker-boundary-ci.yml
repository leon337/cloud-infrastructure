name: docker-boundary-ci

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-boundary-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact desired state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Install the required shell validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Validate the complete repository and Docker boundary artifacts
        env:
          PYTHON: python
          REQUIRE_ANSIBLE: "1"
          REQUIRE_SHELLCHECK: "1"
        run: scripts/test.sh

  disposable-integration:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the complete tested history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the locked Ansible controller
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Prove install, confinement, idempotence and bounded rollback
        env:
          DOCKER_BOUNDARY_TEST_PRIVILEGED_CONFIRM: GITHUB_HOSTED_UBUNTU_24_04_DISPOSABLE_VM_ONLY
        run: scripts/test_docker_boundary_vm.sh
