name: docker-boundary-ci

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-boundary-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact desired state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Provision the pinned shell validator in runner temp
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "${SHELLCHECK_SHA256}" "${archive}" | sha256sum --check
          tar -xJf "${archive}" -C "${RUNNER_TEMP}"
          printf '%s\n' \
            "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}" >> "${GITHUB_PATH}"

      - name: Validate the complete repository and Docker boundary artifacts
        env:
          PYTHON: python
          REQUIRE_ANSIBLE: "1"
          REQUIRE_SHELLCHECK: "1"
        run: scripts/test.sh

  disposable-integration:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the complete tested history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the locked Ansible controller
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Prove install, confinement, idempotence and bounded rollback
        env:
          DOCKER_BOUNDARY_TEST_PRIVILEGED_CONFIRM: GITHUB_HOSTED_UBUNTU_24_04_DISPOSABLE_VM_ONLY
        run: scripts/test_docker_boundary_vm.sh

  network-services-integration:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact network-services desired state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove scoped DNS, proxy egress and explicit shared-service grants
        env:
          DOCKER_BOUNDARY_TEST_PRIVILEGED_CONFIRM: GITHUB_HOSTED_UBUNTU_24_04_DISPOSABLE_VM_ONLY
        run: scripts/test_network_services_standalone_vm.sh
