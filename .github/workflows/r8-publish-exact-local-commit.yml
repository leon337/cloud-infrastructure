name: r8-publish-exact-local-commit

on:
  push:
    branches:
      - ops/r8-task7-syntax-selfhosted-20260822

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Publish exact guarded local R8 commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_LOCAL: 047495c5c4215fc82d9e52d30114608af56deee5
          EXPECTED_REMOTE: 5db49d76dd530038aaf032aeba055b61eaab653a
          TARGET_BRANCH: codex/control-bridge-g2b
        run: |
          set -euo pipefail
          repo=/home/ubuntu/cloud-infrastructure
          cd "$repo"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_LOCAL"
          test -z "$(git status --porcelain)"
          auth_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_sha="$(git ls-remote "$auth_url" "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_sha" = "$EXPECTED_REMOTE"
          git push "$auth_url" "${EXPECTED_LOCAL}:refs/heads/${TARGET_BRANCH}"
          final_sha="$(git ls-remote "$auth_url" "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$final_sha" = "$EXPECTED_LOCAL"
          printf 'R8_EXACT_COMMIT_PUBLISHED=%s\n' "$final_sha"
