name: hermes-resident-operator

on:
  push:
    branches:
      - mcf/hermes-relay-bootstrap-20260823
    paths:
      - .github/workflows/hermes-resident-operator.yml
      - ops/hermes-resident/**

permissions:
  contents: write

concurrency:
  group: hermes-resident-operator-node01
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 30
    env:
      HOME: /home/ubuntu
      PATH: /home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
      DISPLAY: ':10'
      XAUTHORITY: /home/ubuntu/.Xauthority

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: mcf/hermes-relay-bootstrap-20260823
          fetch-depth: 0

      - name: Verify authority boundary and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = ubuntu
          if sudo -n true 2>/dev/null; then
            echo 'REFUSED: runner unexpectedly has passwordless sudo' >&2
            exit 1
          fi
          test -x "$HOME/.local/bin/hermes"
          test -x "$HOME/.local/bin/llama"
          test -x "$HOME/.local/bin/cua-driver"
          test -S /run/user/1000/bus
          test -f "$HOME/.Xauthority"
          echo 'BOUNDARY=PASS'

      - name: Install resident operator files
        shell: bash
        run: |
          set -euo pipefail
          app="$HOME/.local/share/hermes-resident"
          units="$HOME/.config/systemd/user"
          state="$HOME/.local/state/hermes-operator"
          mkdir -p "$app" "$units" "$state"
          install -m 0700 ops/hermes-resident/controller.py "$app/controller.py"
          install -m 0700 ops/hermes-resident/mission_runner.py "$app/mission_runner.py"
          install -m 0644 ops/hermes-resident/hermes-provider.service "$units/hermes-provider.service"
          install -m 0644 ops/hermes-resident/hermes-controller.service "$units/hermes-controller.service"
          echo 'FILES=PASS'

      - name: Configure Hermes to resident local provider
        shell: bash
        run: |
          set -euo pipefail
          py=''
          for p in "$HOME/.hermes/venv/bin/python" "$HOME/.hermes/hermes-agent/.venv/bin/python" /usr/bin/python3; do
            if [[ -x "$p" ]] && "$p" -c 'import yaml' >/dev/null 2>&1; then py="$p"; break; fi
          done
          test -n "$py"
          "$py" - <<'PY'
          from pathlib import Path
          import os,tempfile,yaml,json
          p=Path('/home/ubuntu/.hermes/config.yaml')
          cfg=yaml.safe_load(p.read_text()) if p.exists() else {}
          if not isinstance(cfg,dict): cfg={}
          model=cfg.get('model')
          if not isinstance(model,dict): model={}
          model.update({'default':'qwen3.5-2b','provider':'custom','base_url':'http://127.0.0.1:8080/v1','api_key':'no-key','context_length':65536})
          cfg['model']=model
          p.parent.mkdir(parents=True,exist_ok=True)
          fd,tmp=tempfile.mkstemp(prefix='config.',suffix='.yaml',dir=str(p.parent)); os.close(fd)
          Path(tmp).write_text(yaml.safe_dump(cfg,sort_keys=False,allow_unicode=True))
          os.chmod(tmp,0o600); os.replace(tmp,p)
          print(json.dumps({k:('REDACTED' if k=='api_key' else v) for k,v in model.items()}))
          PY
          echo 'MODEL_CONFIG=PASS'

      - name: Replace transient processes with user services
        shell: bash
        run: |
          set -euo pipefail
          pkill -u "$(id -u)" -f 'mcf-hermes-relay/relay.py' 2>/dev/null || true
          pkill -u "$(id -u)" -f '/home/ubuntu/.local/bin/llama serve' 2>/dev/null || true
          pkill -u "$(id -u)" -f '/home/ubuntu/.local/bin/hermes -z' 2>/dev/null || true
          sleep 3
          systemctl --user daemon-reload
          systemctl --user enable hermes-provider.service hermes-controller.service
          systemctl --user restart hermes-provider.service
          systemctl --user restart hermes-controller.service
          echo 'SERVICES_STARTED=PASS'

      - name: Wait for provider and controller
        shell: bash
        run: |
          set -euo pipefail
          provider=0
          controller=0
          for i in $(seq 1 180); do
            code=$(curl -sS -o /tmp/hermes-provider-health -w '%{http_code}' --max-time 3 http://127.0.0.1:8080/health 2>/dev/null || true)
            [[ "$code" == 200 ]] && provider=1
            [[ -S /tmp/hermes-operator-control.sock ]] && controller=1
            if [[ "$provider" == 1 && "$controller" == 1 ]]; then break; fi
            sleep 5
          done
          [[ "$provider" == 1 ]] || { journalctl --user -u hermes-provider.service -n 120 --no-pager || true; exit 1; }
          [[ "$controller" == 1 ]] || { journalctl --user -u hermes-controller.service -n 120 --no-pager || true; exit 1; }
          echo 'RESIDENT_RUNTIME=PASS'

      - name: Verify local tool calling
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          timeout 180 curl -fsS http://127.0.0.1:8080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen3.5-2b","messages":[{"role":"user","content":"Call readiness with HERMES_READY."}],"tools":[{"type":"function","function":{"name":"readiness","description":"Record readiness","parameters":{"type":"object","properties":{"value":{"type":"string"}},"required":["value"]}}}],"tool_choice":"required","temperature":0,"max_tokens":48}' > "$tmp"
          python3 - "$tmp" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1]))
          calls=obj.get('choices',[{}])[0].get('message',{}).get('tool_calls') or []
          if not calls: raise SystemExit('TOOL_CALLING=FAIL')
          fn=calls[0].get('function',{})
          if fn.get('name')!='readiness': raise SystemExit('TOOL_NAME=FAIL')
          print('TOOL_CALLING=PASS')
          PY
          rm -f "$tmp"

      - name: Verify resident control plane
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,socket
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM)
          s.connect('/tmp/hermes-operator-control.sock')
          s.sendall(b'{"op":"runtime"}\n')
          data=b''
          while b'\n' not in data: data+=s.recv(4096)
          obj=json.loads(data.split(b'\n',1)[0])
          assert obj.get('ok') and obj.get('provider_healthy') and obj.get('runner_present'), obj
          print('CONTROL_PLANE=PASS')
          print('MISSION_ID='+obj['mission_id'])
          PY
          systemctl --user is-enabled hermes-provider.service hermes-controller.service
          systemctl --user is-active hermes-provider.service hermes-controller.service
          echo 'DEPLOYMENT=PASS'

      - name: Persist sanitized deployment evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p artifacts/hermes-resident
          out=artifacts/hermes-resident/deploy-status.txt
          {
            echo "UTC=$(date -u +%FT%TZ)"
            echo "HOST=$(hostname)"
            echo "USER=$(id -un)"
            echo "MISSION_ID=MCF-HERMES-PC-002"
            echo "PROVIDER_ACTIVE=$(systemctl --user is-active hermes-provider.service 2>/dev/null || true)"
            echo "PROVIDER_ENABLED=$(systemctl --user is-enabled hermes-provider.service 2>/dev/null || true)"
            echo "CONTROLLER_ACTIVE=$(systemctl --user is-active hermes-controller.service 2>/dev/null || true)"
            echo "CONTROLLER_ENABLED=$(systemctl --user is-enabled hermes-controller.service 2>/dev/null || true)"
            echo "PROVIDER_HEALTH=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8080/health 2>/dev/null || true)"
            echo "CONTROL_SOCKET=$([[ -S /tmp/hermes-operator-control.sock ]] && echo yes || echo no)"
            echo "HERMES_VERSION=$($HOME/.local/bin/hermes --version 2>/dev/null | head -1 || true)"
            free -h | awk '/Mem:/{print "MEM_USED="$3" MEM_AVAILABLE="$7}'
          } > "$out"
          cat "$out"
          git config user.name 'mcf-hermes-resident'
          git config user.email 'mcf-hermes-resident@users.noreply.github.com'
          git add "$out"
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record resident Hermes deployment status [skip ci]'
            git pull --rebase origin mcf/hermes-relay-bootstrap-20260823
            git push origin HEAD:mcf/hermes-relay-bootstrap-20260823
          fi
