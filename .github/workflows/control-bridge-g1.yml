name: control-bridge-g1

on:
  push:
    branches:
      - mcf/mission-001-control-bridge-g1
    paths:
      - control/dispatch/probe.json
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: control-bridge-g1-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[VPS-CMD] PROBE'))
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10

    steps:
      - name: Check out exact bridge state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run bounded NODE-01 probe
        env:
          CONTROL_BRIDGE_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/control_bridge_probe.py \
            --event-name "${CONTROL_BRIDGE_EVENT_NAME}" \
            --event-path "${GITHUB_EVENT_PATH}" \
            --request-file control/dispatch/probe.json \
            --result-file "${RUNNER_TEMP}/control-bridge-result.json"

      - name: Mission 2 — launch or verify persistent interactive PTY
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -u
          request_id="$(python3 -c 'import json; print(json.load(open("control/dispatch/probe.json"))["request_id"])')"
          case "$request_id" in
            VPS-MISSION2-PERSISTENT-HELLO-003|VPS-MISSION2-PERSISTENT-HELLO-004) ;;
            *) exit 0 ;;
          esac

          bin_dir="$HOME/.local/bin"
          state_dir="$HOME/.local/state"
          terminal_py="$bin_dir/mcf-mission2-terminal.py"
          pid_file="$state_dir/mcf-mission2-terminal.pid"
          daemon_log="$state_dir/mcf-mission2-terminal-daemon.log"
          socket_path="/run/user/$(id -u)/mcf-mission2-terminal.sock"
          mkdir -p "$bin_dir" "$state_dir"

          if [ "$request_id" = 'VPS-MISSION2-PERSISTENT-HELLO-003' ]; then
            cat > "$terminal_py" <<'PY'
          #!/usr/bin/env python3
          import errno
          import os
          import pty
          import select
          import socket
          from pathlib import Path

          runtime_dir = Path(os.environ.get('XDG_RUNTIME_DIR') or f'/run/user/{os.getuid()}')
          socket_path = runtime_dir / 'mcf-mission2-terminal.sock'
          transcript_path = Path.home() / '.local/state/mcf-mission2-terminal.log'
          try:
              socket_path.unlink()
          except FileNotFoundError:
              pass

          child_pid, master_fd = pty.fork()
          if child_pid == 0:
              os.environ['PS1'] = 'mcf-mission2$ '
              os.execv('/bin/bash', ['/bin/bash', '--noprofile', '--norc', '-i'])

          os.set_blocking(master_fd, False)
          server = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          server.bind(str(socket_path))
          os.chmod(socket_path, 0o600)
          server.listen(4)
          server.setblocking(False)
          clients = []
          backlog = bytearray()
          os.write(master_fd, b"printf 'Hello World\\n'\n")

          transcript_path.parent.mkdir(parents=True, exist_ok=True)
          with open(transcript_path, 'ab', buffering=0) as log:
              try:
                  while True:
                      readable, _, _ = select.select([master_fd, server, *clients], [], [], 1.0)
                      if master_fd in readable:
                          try:
                              data = os.read(master_fd, 4096)
                          except OSError as exc:
                              if exc.errno == errno.EIO:
                                  break
                              raise
                          if not data:
                              break
                          log.write(data)
                          backlog.extend(data)
                          if len(backlog) > 65536:
                              del backlog[:-65536]
                          for client in clients[:]:
                              try:
                                  client.sendall(data)
                              except OSError:
                                  client.close()
                                  clients.remove(client)

                      if server in readable:
                          client, _ = server.accept()
                          client.setblocking(True)
                          if backlog:
                              client.sendall(backlog)
                          client.setblocking(False)
                          clients.append(client)

                      for client in clients[:]:
                          if client not in readable:
                              continue
                          try:
                              data = client.recv(4096)
                          except BlockingIOError:
                              continue
                          except OSError:
                              data = b''
                          if not data:
                              client.close()
                              clients.remove(client)
                              continue
                          os.write(master_fd, data)
              finally:
                  for client in clients:
                      client.close()
                  server.close()
                  try:
                      socket_path.unlink()
                  except FileNotFoundError:
                      pass
          PY
            chmod 700 "$terminal_py"

            if [ -f "$pid_file" ]; then
              old_pid="$(cat "$pid_file" 2>/dev/null || true)"
              if [ -n "$old_pid" ] && kill -0 "$old_pid" 2>/dev/null; then
                old_cmd="$(tr '\0' ' ' < "/proc/$old_pid/cmdline" 2>/dev/null || true)"
                case "$old_cmd" in
                  *mcf-mission2-terminal.py*) kill "$old_pid" 2>/dev/null || true; sleep 1 ;;
                esac
              fi
            fi
            rm -f "$socket_path" "$pid_file"

            (
              unset RUNNER_TRACKING_ID
              nohup setsid "$terminal_py" >>"$daemon_log" 2>&1 < /dev/null &
              echo $! > "$pid_file"
            )
            sleep 3
          fi

          rc=1
          mode="PTY_SOCKET"
          evidence=""
          err=""
          pid="$(cat "$pid_file" 2>/dev/null || true)"

          if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null && [ -S "$socket_path" ]; then
            verify="$(SOCKET_PATH="$socket_path" python3 - <<'PY'
          import os, socket, time
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.settimeout(2)
          s.connect(os.environ['SOCKET_PATH'])
          chunks = []
          end = time.time() + 2
          while time.time() < end:
              try:
                  data = s.recv(4096)
              except socket.timeout:
                  break
              if not data:
                  break
              chunks.append(data)
              if b'Hello World' in b''.join(chunks):
                  break
          s.close()
          text = b''.join(chunks).decode('utf-8', 'replace')
          print('HELLO_WORLD_PRESENT=YES' if 'Hello World' in text else 'HELLO_WORLD_PRESENT=NO')
          PY
          )"
            if [ "$verify" = 'HELLO_WORLD_PRESENT=YES' ]; then
              rc=0
              evidence="pid=$pid process_alive=YES socket=$socket_path socket_mode=$(stat -c '%a' "$socket_path") $verify request=$request_id"
            else
              err="$verify"
            fi
          else
            err="persistent_pty_process_or_socket_not_active pid=${pid:-NONE}"
          fi

          MODE="$mode" EVIDENCE="$evidence" RC="$rc" ERR="$err" RESULT_FILE="${RUNNER_TEMP}/control-bridge-result.json" REQUEST_ID="$request_id" python3 - <<'PY'
          import datetime as dt, json, os
          p = os.environ['RESULT_FILE']
          data = json.load(open(p, encoding='utf-8'))
          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          rc = int(os.environ['RC'])
          data.setdefault('probes', []).append({
              'name': 'mission2_persistent_terminal',
              'argv': ['FIXED_MISSION2_PERSISTENT_PTY', os.environ['REQUEST_ID']],
              'exit_code': rc,
              'stdout': f"mode={os.environ['MODE']} terminal_text=Hello World {os.environ['EVIDENCE']}" if rc == 0 else '',
              'stderr': os.environ['ERR'],
              'started_at': now,
              'finished_at': now,
          })
          if rc != 0:
              data['status'] = 'PARTIAL'
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, sort_keys=True)
              f.write('\n')
          PY

      - name: Publish probe result to request issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/control_bridge_publish.py \
            --result-file "${RUNNER_TEMP}/control-bridge-result.json"

      - name: Add result to Actions summary
        if: always()
        run: |
          {
            printf '%s\n\n' '## MCF VPS Control Bridge G1'
            printf '%s\n' '```json'
            cat "${RUNNER_TEMP}/control-bridge-result.json"
            printf '%s\n' '```'
          } >> "${GITHUB_STEP_SUMMARY}"
