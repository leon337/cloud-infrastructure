name: control-bridge-g1

on:
  push:
    branches:
      - mcf/mission-001-control-bridge-g1
    paths:
      - control/dispatch/probe.json
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: control-bridge-g1-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[VPS-CMD] PROBE'))
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10

    steps:
      - name: Check out exact bridge state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run bounded NODE-01 probe
        env:
          CONTROL_BRIDGE_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/control_bridge_probe.py \
            --event-name "${CONTROL_BRIDGE_EVENT_NAME}" \
            --event-path "${GITHUB_EVENT_PATH}" \
            --request-file control/dispatch/probe.json \
            --result-file "${RUNNER_TEMP}/control-bridge-result.json"

      - name: Mission 2 — leave persistent Hello World terminal open
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -u
          request_id="$(python3 -c 'import json; print(json.load(open("control/dispatch/probe.json"))["request_id"])')"
          if [ "$request_id" != 'VPS-MISSION2-PERSISTENT-HELLO-001' ]; then
            exit 0
          fi

          unit="mcf-mission2-hello-terminal.service"
          mode=""
          evidence=""
          rc=1
          err=""

          systemctl --user stop "$unit" >/dev/null 2>&1 || true
          systemctl --user reset-failed "$unit" >/dev/null 2>&1 || true

          xfce_pid="$(pgrep -u "$(id -u)" -n xfce4-session || true)"
          if command -v xfce4-terminal >/dev/null 2>&1 && [ -n "$xfce_pid" ] && [ -r "/proc/$xfce_pid/environ" ]; then
            session_env="$(tr '\0' '\n' < "/proc/$xfce_pid/environ")"
            display="$(printf '%s\n' "$session_env" | sed -n 's/^DISPLAY=//p' | tail -n1)"
            dbus="$(printf '%s\n' "$session_env" | sed -n 's/^DBUS_SESSION_BUS_ADDRESS=//p' | tail -n1)"
            xauth="$(printf '%s\n' "$session_env" | sed -n 's/^XAUTHORITY=//p' | tail -n1)"
            if [ -n "$display" ] && [ -n "$dbus" ]; then
              args=(--user --unit="$unit" --collect --setenv="DISPLAY=$display" --setenv="DBUS_SESSION_BUS_ADDRESS=$dbus")
              if [ -n "$xauth" ]; then args+=(--setenv="XAUTHORITY=$xauth"); fi
              if systemd-run "${args[@]}" /usr/bin/xfce4-terminal --disable-server --title='MCF Mission 2 — Hello World' --hold --command="/bin/bash -lc 'printf \"Hello World\\n\"; exec /bin/bash'"; then
                sleep 3
                if systemctl --user is-active --quiet "$unit"; then
                  mode="XFCE_GUI"
                  evidence="$(systemctl --user show "$unit" -p ActiveState -p SubState -p MainPID --no-pager | tr '\n' ' ')"
                  rc=0
                fi
              fi
            fi
          fi

          if [ "$rc" -ne 0 ] && command -v tmux >/dev/null 2>&1; then
            systemctl --user stop "$unit" >/dev/null 2>&1 || true
            if systemd-run --user --unit="$unit" --collect /usr/bin/tmux -D new-session -s mcf-mission2-hello "/bin/bash -lc 'printf \"Hello World\\n\"; exec /bin/bash'"; then
              sleep 2
              if systemctl --user is-active --quiet "$unit"; then
                mode="TMUX"
                evidence="$(systemctl --user show "$unit" -p ActiveState -p SubState -p MainPID --no-pager | tr '\n' ' ')"
                rc=0
              fi
            fi
          fi

          if [ "$rc" -ne 0 ]; then
            err="no_persistent_terminal_path_became_active"
          fi

          MODE="$mode" EVIDENCE="$evidence" RC="$rc" ERR="$err" RESULT_FILE="${RUNNER_TEMP}/control-bridge-result.json" python3 - <<'PY'
          import datetime as dt, json, os
          p = os.environ['RESULT_FILE']
          data = json.load(open(p, encoding='utf-8'))
          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          rc = int(os.environ['RC'])
          data.setdefault('probes', []).append({
              'name': 'mission2_persistent_terminal',
              'argv': ['FIXED_MISSION2_PERSISTENT_TERMINAL'],
              'exit_code': rc,
              'stdout': f"mode={os.environ['MODE']} Hello World {os.environ['EVIDENCE']}" if rc == 0 else '',
              'stderr': os.environ['ERR'],
              'started_at': now,
              'finished_at': now,
          })
          if rc != 0:
              data['status'] = 'PARTIAL'
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, sort_keys=True)
              f.write('\n')
          PY

      - name: Publish probe result to request issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/control_bridge_publish.py \
            --result-file "${RUNNER_TEMP}/control-bridge-result.json"

      - name: Add result to Actions summary
        if: always()
        run: |
          {
            printf '%s\n\n' '## MCF VPS Control Bridge G1'
            printf '%s\n' '```json'
            cat "${RUNNER_TEMP}/control-bridge-result.json"
            printf '%s\n' '```'
          } >> "${GITHUB_STEP_SUMMARY}"
