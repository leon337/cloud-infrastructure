name: f1-2c-runner-status-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-2c-runner-status-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 5
    steps:
      - name: Verify rollback boundary
        run: |
          printf 'NODE_HOST=%s\n' "$(hostname)"
          if sudo -n true 2>/dev/null; then
            echo 'ROLLBACK_PROBE_REFUSED unexpected_generic_passwordless_sudo' >&2
            exit 1
          fi
          test "$(sha256sum /usr/local/sbin/codex-mission-001-runner | awk '{print $1}')" = \
            "83772473ae19f7ddc7e06864ee408bc48b19cff4025cc1e7ec6b609f58fedc96"
          echo 'ROLLBACK_BOUNDARY_PASS'

      - name: Attempt exact allowlisted rollback once
        run: |
          set +e
          output=$(sudo -n /usr/local/sbin/codex-mission-001-runner rollback 2>&1)
          rc=$?
          set -e
          printf '%s\n' "${output}"
          printf 'ROLLBACK_RC=%s\n' "${rc}"

      - name: Capture post-attempt state
        run: |
          set +e
          sudo -n /usr/local/sbin/codex-mission-001-runner status
          echo "RUNNER_STATUS_RC=$?"
          sudo -n /usr/local/sbin/codex-mission-001-runner check
          echo "RUNNER_CHECK_RC=$?"
          set -e
          systemctl status cloud-platform-network-services.service --no-pager --full || true
          for unit in ssh ufw fail2ban xrdp xrdp-sesman docker containerd cloud-platform-network-enforcement.service; do
            state=$(systemctl is-active "${unit}" 2>/dev/null || true)
            printf 'ESSENTIAL_SERVICE unit=%s state=%s\n' "${unit}" "${state}"
          done
