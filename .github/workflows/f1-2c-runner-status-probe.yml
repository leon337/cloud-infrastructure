name: f1-2c-runner-status-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-2c-runner-status-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10
    steps:
      - name: Check out exact KVM Task 1 RED commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 946b45e317554d4a3c6b8caf469ab41e793ff852
          fetch-depth: 1
          persist-credentials: false

      - name: Verify unprivileged boundary
        run: |
          if sudo -n true 2>/dev/null; then
            echo 'TDD_REFUSED unexpected_generic_passwordless_sudo' >&2
            exit 1
          fi
          if [[ -S /var/run/docker.sock && -r /var/run/docker.sock && -w /var/run/docker.sock ]]; then
            echo 'TDD_REFUSED docker_socket_read_write' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "946b45e317554d4a3c6b8caf469ab41e793ff852"
          echo 'TDD_BOUNDARY_PASS'

      - name: Prove KVM Task 1 tests are RED for missing implementation
        run: |
          test ! -e platform/kvm/f1-2c-ubuntu-24.04-amd64.env
          test ! -e scripts/run_f1_2c_kvm_lab.sh
          for test_name in \
            tests.test_local_kvm_lab.LocalKvmLabTests.test_image_is_release_pinned_by_url_and_sha256 \
            tests.test_local_kvm_lab.LocalKvmLabTests.test_launcher_has_one_fixed_candidate_argument_and_no_arbitrary_command; do
            set +e
            output=$(python3 -m unittest -v "$test_name" 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$output"
            [[ "$rc" -ne 0 ]] || { echo 'TDD_RED_REFUSED test_unexpectedly_passed' >&2; exit 1; }
            grep -Fq 'FileNotFoundError' <<<"$output" || { echo 'TDD_RED_REFUSED wrong_failure_mode' >&2; exit 1; }
          done
          echo 'TDD_KVM_TASK1_RED_CONFIRMED'

      - name: Preserve current host safety evidence
        run: |
          for unit in ssh ufw fail2ban xrdp xrdp-sesman docker containerd cloud-platform-network-enforcement.service; do
            state=$(systemctl is-active "${unit}" 2>/dev/null || true)
            printf 'ESSENTIAL_SERVICE unit=%s state=%s\n' "${unit}" "${state}"
          done
          systemctl is-active cloud-platform-network-services.service 2>/dev/null || true
