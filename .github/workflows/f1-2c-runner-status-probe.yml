name: f1-2c-runner-status-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-2c-runner-status-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 5
    steps:
      - name: Check out fix branch as unprivileged test subject
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/f1-2c-systemd-runtime-lock
          fetch-depth: 1
          persist-credentials: false

      - name: Verify unprivileged boundary
        run: |
          if sudo -n true 2>/dev/null; then
            echo 'TDD_REFUSED unexpected_generic_passwordless_sudo' >&2
            exit 1
          fi
          echo 'TDD_BOUNDARY_PASS'

      - name: Prove runtime-lock regression test is RED
        run: |
          set +e
          python3 -m unittest -v \
            tests.test_node_network_services.NodeNetworkServicesTests.test_systemd_strict_protection_has_private_writable_runtime_lock \
            >"${RUNNER_TEMP}/runtime-lock-red.log" 2>&1
          rc=$?
          set -e
          cat "${RUNNER_TEMP}/runtime-lock-red.log"
          if [[ ${rc} -eq 0 ]]; then
            echo 'TDD_RED_REFUSED test_unexpectedly_passed' >&2
            exit 1
          fi
          grep -q 'RuntimeDirectory=cloud-platform-network-services' \
            "${RUNNER_TEMP}/runtime-lock-red.log"
          echo 'TDD_RED_CONFIRMED'
