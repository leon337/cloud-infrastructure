name: f1-2c-runner-status-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f1-2c-runner-status-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10
    steps:
      - name: Check out exact KVM Task 2 implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/f1-2c-systemd-runtime-lock
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact head and unprivileged host boundary
        run: |
          test "$(git rev-parse HEAD)" = "7e32c0822cab8f3dee6d2717caf8df2dbed802cf"
          if sudo -n true 2>/dev/null; then exit 1; fi
          if [[ -S /var/run/docker.sock && -r /var/run/docker.sock && -w /var/run/docker.sock ]]; then exit 1; fi
          echo 'TDD_BOUNDARY_PASS'

      - name: Mark launcher executable and prove focused GREEN
        run: |
          chmod 0755 scripts/run_f1_2c_kvm_lab.sh
          python3 -m unittest -v tests.test_local_kvm_lab.LocalKvmLabTests.test_host_preflight_is_fail_closed_and_unprivileged
          python3 -m unittest -v \
            tests.test_local_kvm_lab.LocalKvmLabTests.test_image_is_release_pinned_by_url_and_sha256 \
            tests.test_local_kvm_lab.LocalKvmLabTests.test_launcher_has_one_fixed_candidate_argument_and_no_arbitrary_command
          bash -n scripts/run_f1_2c_kvm_lab.sh
          git diff --check
          echo 'TDD_KVM_TASK2_GREEN_CONFIRMED'

      - name: Commit tested executable mode only
        run: |
          test -z "$(git status --porcelain | grep -v '^ M scripts/run_f1_2c_kvm_lab.sh$')"
          git config user.name 'MCF controlled automation'
          git config user.email 'mcf-controlled-automation@users.noreply.github.com'
          git add scripts/run_f1_2c_kvm_lab.sh
          git diff --cached --check
          git commit -m 'chore(f1.2c): mark KVM lab launcher executable'
          git push origin HEAD:fix/f1-2c-systemd-runtime-lock
          echo 'KVM_TASK2_MODE_PUSH_PASS'

      - name: Preserve current host safety evidence
        run: |
          for unit in ssh ufw fail2ban xrdp xrdp-sesman docker containerd cloud-platform-network-enforcement.service; do
            printf 'ESSENTIAL_SERVICE unit=%s state=%s\n' "$unit" "$(systemctl is-active "$unit" 2>/dev/null || true)"
          done
          systemctl is-active cloud-platform-network-services.service 2>/dev/null || true
