name: f1-2c-runner-status-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-2c-runner-status-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10
    steps:
      - name: Check out exact KVM Task 6 RED commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 087467fb93318c751a328e2e1d9e3065a378f67e
          fetch-depth: 1
          persist-credentials: false

      - name: Verify unprivileged boundary
        run: |
          test "$(git rev-parse HEAD)" = "087467fb93318c751a328e2e1d9e3065a378f67e"
          if sudo -n true 2>/dev/null; then exit 1; fi
          if [[ -S /var/run/docker.sock && -r /var/run/docker.sock && -w /var/run/docker.sock ]]; then exit 1; fi
          test -x scripts/run_f1_2c_kvm_lab.sh
          echo 'TDD_BOUNDARY_PASS'

      - name: Prove KVM Task 6 bundle transfer test is RED
        run: |
          set +e
          output=$(python3 -m unittest -v tests.test_local_kvm_lab.LocalKvmLabTests.test_candidate_transfer_is_exact_bundle_and_fixed_guest_harness 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          [[ "$rc" -ne 0 ]] || { echo 'TDD_RED_REFUSED test_unexpectedly_passed' >&2; exit 1; }
          grep -Eq 'AssertionError|assert' <<<"$output" || { echo 'TDD_RED_REFUSED wrong_failure_mode' >&2; exit 1; }
          echo 'TDD_KVM_TASK6_RED_CONFIRMED'

      - name: Preserve current host safety evidence
        run: |
          for unit in ssh ufw fail2ban xrdp xrdp-sesman docker containerd cloud-platform-network-enforcement.service; do
            printf 'ESSENTIAL_SERVICE unit=%s state=%s\n' "$unit" "$(systemctl is-active "$unit" 2>/dev/null || true)"
          done
          systemctl is-active cloud-platform-network-services.service 2>/dev/null || true
