name: f1-2c-runner-status-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-2c-runner-status-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10
    steps:
      - name: Check out exact TDD RED commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 3751d80f7c6ea2b9a9d5bc3b74dc54f310ce9555
          fetch-depth: 1
          persist-credentials: false

      - name: Verify unprivileged boundary
        run: |
          if sudo -n true 2>/dev/null; then
            echo 'TDD_REFUSED unexpected_generic_passwordless_sudo' >&2
            exit 1
          fi
          if [[ -S /var/run/docker.sock && -r /var/run/docker.sock && -w /var/run/docker.sock ]]; then
            echo 'TDD_REFUSED docker_socket_read_write' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "3751d80f7c6ea2b9a9d5bc3b74dc54f310ce9555"
          echo 'TDD_BOUNDARY_PASS'

      - name: Prove exact-systemd disposable harness regression is RED
        shell: bash
        run: |
          set +e
          python3 -m unittest -v \
            tests.test_node_network_services.NodeNetworkServicesTests.test_disposable_vm_harness_exercises_the_exact_systemd_service \
            >"${RUNNER_TEMP}/systemd-harness-red.log" 2>&1
          rc=$?
          set -e
          cat "${RUNNER_TEMP}/systemd-harness-red.log"
          if [[ "$rc" -eq 0 ]]; then
            echo 'TDD_RED_REFUSED test_unexpectedly_passed' >&2
            exit 1
          fi
          grep -q 'platform/systemd/cloud-platform-network-services.service' \
            "${RUNNER_TEMP}/systemd-harness-red.log"
          echo 'TDD_SYSTEMD_HARNESS_RED_CONFIRMED'

      - name: Preserve current host safety evidence
        run: |
          for unit in ssh ufw fail2ban xrdp xrdp-sesman docker containerd cloud-platform-network-enforcement.service; do
            state=$(systemctl is-active "${unit}" 2>/dev/null || true)
            printf 'ESSENTIAL_SERVICE unit=%s state=%s\n' "${unit}" "${state}"
          done
          systemctl is-active cloud-platform-network-services.service 2>/dev/null || true
