name: f1-2c-runner-status-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-2c-runner-status-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10
    steps:
      - name: Check out exact KVM Task 1 GREEN commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 2bb18bca0b40e6c84e540569e5be5512f3634e7b
          fetch-depth: 1
          persist-credentials: false

      - name: Verify unprivileged boundary
        run: |
          if sudo -n true 2>/dev/null; then
            echo 'TDD_REFUSED unexpected_generic_passwordless_sudo' >&2
            exit 1
          fi
          if [[ -S /var/run/docker.sock && -r /var/run/docker.sock && -w /var/run/docker.sock ]]; then
            echo 'TDD_REFUSED docker_socket_read_write' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "2bb18bca0b40e6c84e540569e5be5512f3634e7b"
          echo 'TDD_BOUNDARY_PASS'

      - name: Prove KVM Task 1 focused tests GREEN
        run: |
          python3 -m unittest -v \
            tests.test_local_kvm_lab.LocalKvmLabTests.test_image_is_release_pinned_by_url_and_sha256 \
            tests.test_local_kvm_lab.LocalKvmLabTests.test_launcher_has_one_fixed_candidate_argument_and_no_arbitrary_command
          bash -n scripts/run_f1_2c_kvm_lab.sh
          echo 'TDD_KVM_TASK1_GREEN_CONFIRMED'

      - name: Preserve current host safety evidence
        run: |
          for unit in ssh ufw fail2ban xrdp xrdp-sesman docker containerd cloud-platform-network-enforcement.service; do
            state=$(systemctl is-active "${unit}" 2>/dev/null || true)
            printf 'ESSENTIAL_SERVICE unit=%s state=%s\n' "${unit}" "${state}"
          done
          systemctl is-active cloud-platform-network-services.service 2>/dev/null || true
