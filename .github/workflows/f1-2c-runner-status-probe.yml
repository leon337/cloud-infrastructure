name: f1-2c-runner-status-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-2c-runner-status-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10
    steps:
      - name: Verify diagnostic boundary
        run: |
          printf 'NODE_HOST=%s\n' "$(hostname)"
          id
          if sudo -n true 2>/dev/null; then
            echo 'DIAGNOSTIC_REFUSED unexpected_generic_passwordless_sudo' >&2
            exit 1
          fi
          echo 'DIAGNOSTIC_BOUNDARY_PASS'

      - name: Capture network-services unit state
        run: |
          systemctl status cloud-platform-network-services.service --no-pager --full || true
          systemctl show cloud-platform-network-services.service \
            -p ActiveState -p SubState -p Result -p ExecMainCode -p ExecMainStatus \
            -p FragmentPath -p UnitFileState --no-pager || true
          systemctl cat cloud-platform-network-services.service --no-pager || true

      - name: Capture network-services journal
        run: |
          journalctl -u cloud-platform-network-services.service -n 250 --no-pager -o short-iso || true

      - name: Capture installed surface metadata only
        run: |
          for path in \
            /etc/cloud-platform-network-services.managed \
            /usr/local/libexec/cloud-platform-network-services \
            /etc/systemd/system/cloud-platform-network-services.service \
            /etc/sysctl.d/90-cloud-platform-network-forwarding.conf \
            /etc/cloud-platform/network-services \
            /etc/cloud-platform/network-services/compose.yaml; do
            if [[ -e "${path}" ]]; then
              stat -c 'SURFACE_PRESENT path=%n type=%F owner=%U group=%G mode=%a size=%s mtime=%Y' "${path}" || true
              if [[ -f "${path}" && -r "${path}" && "${path}" != /etc/cloud-platform-network-services.managed ]]; then
                sha256sum "${path}" || true
              fi
            else
              echo "SURFACE_ABSENT path=${path}"
            fi
          done

      - name: Capture network state read-only
        run: |
          ip -o link show | sed -n '/cp[0-9a-f]\{8\}/p;/cpeg[0-9]\{4\}/p' || true
          ip -4 route show table all | sed -n '/10\.240\./p' || true
          printf 'IPV4_FORWARD='; sysctl -n net.ipv4.ip_forward
          printf 'IPV6_FORWARD='; sysctl -n net.ipv6.conf.all.forwarding

      - name: Capture allowlisted runner status and check
        run: |
          set +e
          sudo -n /usr/local/sbin/codex-mission-001-runner status
          echo "RUNNER_STATUS_RC=$?"
          sudo -n /usr/local/sbin/codex-mission-001-runner check
          echo "RUNNER_CHECK_RC=$?"
          set -e

      - name: Verify human access services remain active
        run: |
          for unit in ssh ufw fail2ban xrdp xrdp-sesman docker containerd cloud-platform-network-enforcement.service; do
            state=$(systemctl is-active "${unit}" 2>/dev/null || true)
            printf 'ESSENTIAL_SERVICE unit=%s state=%s\n' "${unit}" "${state}"
          done
          systemctl --failed --no-legend --plain || true
