name: f1-2c-runner-status-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-2c-runner-status-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed fix commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 67dc8351ebeb14132c5831bae3464165cf604b72
          fetch-depth: 1
          persist-credentials: false

      - name: Verify unprivileged boundary
        run: |
          if sudo -n true 2>/dev/null; then
            echo 'VERIFY_REFUSED unexpected_generic_passwordless_sudo' >&2
            exit 1
          fi
          if [[ -S /var/run/docker.sock && -r /var/run/docker.sock && -w /var/run/docker.sock ]]; then
            echo 'VERIFY_REFUSED docker_socket_read_write' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "67dc8351ebeb14132c5831bae3464165cf604b72"
          echo 'VERIFY_BOUNDARY_PASS'

      - name: Verify focused regression on pushed commit
        run: |
          python3 -m unittest -v \
            tests.test_node_network_services.NodeNetworkServicesTests.test_systemd_strict_protection_has_private_writable_runtime_lock
          echo 'VERIFY_PUSHED_FOCUSED_PASS'

      - name: Verify complete static suite on pushed commit
        env:
          PYTHON: python3
          REQUIRE_ANSIBLE: "0"
          REQUIRE_SHELLCHECK: "0"
        run: |
          scripts/test.sh
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo 'VERIFY_PUSHED_FULL_STATIC_PASS'
