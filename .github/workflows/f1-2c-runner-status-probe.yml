name: f1-2c-runner-status-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-2c-runner-status-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10
    steps:
      - name: Verify unprivileged boundary
        run: |
          printf 'NODE_HOST=%s\n' "$(hostname)"
          id
          if sudo -n true 2>/dev/null; then
            echo 'CAPABILITY_PROBE_REFUSED unexpected_generic_passwordless_sudo' >&2
            exit 1
          fi
          if [[ -S /var/run/docker.sock && -r /var/run/docker.sock && -w /var/run/docker.sock ]]; then
            echo 'CAPABILITY_PROBE_REFUSED docker_socket_read_write' >&2
            exit 1
          fi
          echo 'CAPABILITY_BOUNDARY_PASS'

      - name: Inspect disposable-environment tooling read-only
        shell: bash
        run: |
          set -u
          tools=(
            systemd-nspawn machinectl debootstrap mmdebstrap
            qemu-system-x86_64 qemu-kvm firecracker
            podman incus lxc-start
            rootlesskit slirp4netns newuidmap newgidmap
            dockerd-rootless.sh dockerd docker
            unshare bwrap systemd-run
          )
          for tool in "${tools[@]}"; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf 'TOOL name=%s path=%s\n' "$tool" "$(command -v "$tool")"
            else
              printf 'TOOL name=%s path=ABSENT\n' "$tool"
            fi
          done
          printf 'USERNS_UNPRIVILEGED_CLONE='; cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo UNKNOWN
          printf 'MAX_USER_NAMESPACES='; cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo UNKNOWN
          printf 'SYSTEMD_VIRT='; systemd-detect-virt 2>/dev/null || true
          printf 'CGROUP_TYPE='; stat -fc %T /sys/fs/cgroup 2>/dev/null || true
          printf 'CGROUP_CONTROLLERS='; cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || true

      - name: Probe unprivileged namespace creation without mutation
        shell: bash
        run: |
          set +e
          unshare --user --map-root-user --mount --pid --fork true
          rc=$?
          set -e
          printf 'UNSHARE_USER_MOUNT_PID_RC=%s\n' "$rc"
          if [[ "$rc" -eq 0 ]]; then
            echo 'UNPRIVILEGED_NAMESPACE_PASS'
          else
            echo 'UNPRIVILEGED_NAMESPACE_UNAVAILABLE'
          fi

      - name: Preserve current host safety evidence
        run: |
          for unit in ssh ufw fail2ban xrdp xrdp-sesman docker containerd cloud-platform-network-enforcement.service; do
            state=$(systemctl is-active "${unit}" 2>/dev/null || true)
            printf 'ESSENTIAL_SERVICE unit=%s state=%s\n' "${unit}" "${state}"
          done
          systemctl is-active cloud-platform-network-services.service 2>/dev/null || true
          systemctl --failed --no-legend --plain || true
