name: f1-2c-runner-status-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-2c-runner-status-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10
    steps:
      - name: Verify NODE-01 identity and unprivileged boundary
        run: |
          printf 'NODE_HOST=%s\n' "$(hostname)"
          id
          if sudo -n true 2>/dev/null; then
            echo 'RUNNER_PROBE_REFUSED unexpected_generic_passwordless_sudo' >&2
            exit 1
          fi
          if [[ -S /var/run/docker.sock && -r /var/run/docker.sock && -w /var/run/docker.sock ]]; then
            echo 'RUNNER_PROBE_REFUSED docker_socket_read_write' >&2
            exit 1
          fi
          echo 'RUNNER_PROBE_BOUNDARY_PASS'

      - name: Inspect Mission 001 objects without reading protected content
        run: |
          for path in \
            /usr/local/sbin/codex-mission-001-runner \
            /usr/local/libexec/codex-mission-001-revoke \
            /etc/codex-mission-001-autonomous-runner.managed \
            /etc/sudoers.d/91-codex-mission-001-temporary \
            /etc/systemd/system/codex-mission-001-revoke.service \
            /etc/systemd/system/codex-mission-001-revoke.timer \
            /var/lib/codex-mission-001 \
            /opt/codex-mission-001/repository \
            /var/log/codex-mission-001; do
            if [[ -e "${path}" ]]; then
              stat -c 'MISSION_OBJECT_PRESENT path=%n type=%F owner=%U group=%G mode=%a size=%s mtime=%Y' "${path}" || \
                echo "MISSION_OBJECT_PRESENT_METADATA_DENIED path=${path}"
            else
              echo "MISSION_OBJECT_ABSENT path=${path}"
            fi
          done
          printf 'REVOKE_TIMER_ACTIVE='; systemctl is-active codex-mission-001-revoke.timer 2>/dev/null || true
          printf 'REVOKE_TIMER_ENABLED='; systemctl is-enabled codex-mission-001-revoke.timer 2>/dev/null || true
          printf 'REVOKE_SERVICE_ACTIVE='; systemctl is-active codex-mission-001-revoke.service 2>/dev/null || true
          systemctl show codex-mission-001-revoke.timer \
            -p ActiveState -p UnitFileState -p NextElapseUSecRealtime -p LastTriggerUSec 2>/dev/null || true

      - name: Verify exact current runner fingerprint
        run: |
          test "$(sha256sum /usr/local/sbin/codex-mission-001-runner | awk '{print $1}')" = \
            "83772473ae19f7ddc7e06864ee408bc48b19cff4025cc1e7ec6b609f58fedc96"
          echo 'MISSION_RUNNER_FINGERPRINT_PASS'

      - name: Verify essential host and route gates read-only
        run: |
          for unit in ssh ufw fail2ban xrdp xrdp-sesman docker containerd cloud-platform-network-enforcement.service; do
            state=$(systemctl is-active "${unit}" 2>/dev/null || true)
            printf 'ESSENTIAL_SERVICE unit=%s state=%s\n' "${unit}" "${state}"
            [[ "${state}" == active ]]
          done
          ! systemctl is-active --quiet snap.lxd.daemon.service
          ! systemctl is-active --quiet snap.lxd.daemon.unix.socket
          test -f /etc/cloud-platform-network-enforcement.managed
          failed=$(systemctl --failed --no-legend --plain | sed '/^[[:space:]]*$/d')
          if [[ -n "${failed}" ]]; then
            printf 'PREAPPLY_REFUSED failed_units=%s\n' "${failed}" >&2
            exit 1
          fi
          python3 - <<'PY'
          import ipaddress
          import subprocess

          desired = [
              ipaddress.ip_network("10.240.0.0/16"),
              ipaddress.ip_network("10.240.254.0/24"),
          ]
          text = subprocess.check_output(
              ["ip", "-4", "route", "show", "table", "all"], text=True
          )
          collisions = []
          for line in text.splitlines():
              network = None
              for token in line.split():
                  try:
                      network = ipaddress.ip_network(token, strict=False)
                  except ValueError:
                      continue
                  if network.version == 4:
                      break
              if network is None:
                  continue
              if any(network.overlaps(target) for target in desired):
                  collisions.append(line)
          if collisions:
              raise SystemExit("PREAPPLY_REFUSED route_collision=" + " | ".join(collisions))
          print("PREAPPLY_ROUTE_COLLISION_PASS")
          PY
          echo 'PREAPPLY_HOST_GATES_PASS'

      - name: Run exact allowlisted Mission 001 status
        run: |
          output=$(sudo -n /usr/local/sbin/codex-mission-001-runner status)
          printf '%s\n' "${output}"
          grep -q '^MISSION_RUNNER_STATUS=ACTIVE$' <<<"${output}"
          grep -q '^GIT_SHA=c9f909945b544d22dbabc619252456f7190f7ae9$' <<<"${output}"
          echo 'MISSION_RUNNER_EXACT_STATUS=ACTIVE'

      - name: Run exact allowlisted Mission 001 check
        run: |
          sudo -n /usr/local/sbin/codex-mission-001-runner check
          echo 'MISSION_RUNNER_EXACT_CHECK=PASS'

      - name: Run exact allowlisted Mission 001 test
        run: |
          sudo -n /usr/local/sbin/codex-mission-001-runner test
          echo 'MISSION_RUNNER_EXACT_TEST=PASS'
