name: canonical-secret-history-diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/canonical-secret-history-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.number == 22 &&
      github.event.pull_request.head.ref == 'team/canonical-state-toolchain-20260822'
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out exact diagnostic state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify credential-in-uri findings without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import collections
          import pathlib
          import re
          import subprocess

          ROOT = pathlib.Path.cwd()
          MAX_SCAN_BYTES = 8 * 1024 * 1024
          URI = re.compile(
              rb"\b(?P<scheme>https?|postgres(?:ql)?|mysql|redis|amqps?)://"
              rb"(?P<user>[^\s/:@]+):(?P<password>[^\s/@]+)@(?P<host>[^\s/:?#]+)",
              re.IGNORECASE,
          )
          PLACEHOLDER_MARKERS = (
              b"user", b"username", b"password", b"passwd", b"pass",
              b"changeme", b"change-me", b"example", b"placeholder",
              b"redacted", b"demo", b"test", b"dummy", b"secret",
          )

          def run(*args: str) -> str:
              return subprocess.check_output(args, cwd=ROOT, text=True)

          names: dict[str, set[str]] = collections.defaultdict(set)
          for line in run("git", "rev-list", "--objects", "--all").splitlines():
              oid, *rest = line.split(" ", 1)
              if rest and rest[0]:
                  names[oid].add(rest[0])

          object_ids = sorted(set(run("git", "rev-list", "--objects", "--all", "--no-object-names").splitlines()))
          if not object_ids:
              raise SystemExit("DIAGNOSTIC_FAIL no reachable objects")

          metadata = subprocess.check_output(
              ["git", "cat-file", "--batch-check=%(objectname) %(objecttype) %(objectsize)"],
              cwd=ROOT,
              input="\n".join(object_ids) + "\n",
              text=True,
          ).splitlines()

          findings = []
          for line in metadata:
              oid, object_type, raw_size = line.split()
              if object_type != "blob" or int(raw_size) > MAX_SCAN_BYTES:
                  continue
              content = subprocess.check_output(["git", "cat-file", "blob", oid], cwd=ROOT)
              matches = list(URI.finditer(content))
              if not matches:
                  continue

              classes = []
              for match in matches:
                  user = match.group("user").lower()
                  password = match.group("password").lower()
                  host = match.group("host").lower()
                  user_placeholder = any(marker in user for marker in PLACEHOLDER_MARKERS)
                  password_placeholder = any(marker in password for marker in PLACEHOLDER_MARKERS)
                  if host in {b"localhost", b"127.0.0.1", b"::1"}:
                      host_class = "LOCAL"
                  elif host.endswith((b".example", b".example.com", b".test", b".invalid")) or host == b"example.com":
                      host_class = "EXAMPLE"
                  else:
                      host_class = "OTHER"
                  if user_placeholder and password_placeholder:
                      credential_class = "PLACEHOLDER_LIKELY"
                  elif host_class in {"LOCAL", "EXAMPLE"} and (user_placeholder or password_placeholder):
                      credential_class = "SYNTHETIC_LIKELY"
                  else:
                      credential_class = "SUSPICIOUS_REQUIRES_REVIEW"
                  classes.append((credential_class, host_class, len(user), len(password)))

              commits = run("git", "log", "--all", "--find-object=" + oid, "--format=%H", "--reverse").splitlines()
              path_text = ",".join(sorted(names.get(oid, {"<path-unresolved>"})))
              strongest = "SUSPICIOUS_REQUIRES_REVIEW" if any(c[0] == "SUSPICIOUS_REQUIRES_REVIEW" for c in classes) else (
                  "SYNTHETIC_LIKELY" if any(c[0] == "SYNTHETIC_LIKELY" for c in classes) else "PLACEHOLDER_LIKELY"
              )
              host_classes = ",".join(sorted({c[1] for c in classes}))
              user_lens = ",".join(str(c[2]) for c in classes)
              password_lens = ",".join(str(c[3]) for c in classes)
              print(
                  "HISTORY_CREDENTIAL_FINDING "
                  f"blob={oid[:12]} paths={path_text} uri_count={len(matches)} "
                  f"classification={strongest} host_class={host_classes} "
                  f"user_len={user_lens} password_len={password_lens} "
                  f"first_commit={(commits[0][:12] if commits else 'UNRESOLVED')} "
                  f"last_commit={(commits[-1][:12] if commits else 'UNRESOLVED')}"
              )
              findings.append(strongest)

          counts = collections.Counter(findings)
          print(
              "HISTORY_CREDENTIAL_SUMMARY "
              f"total={len(findings)} placeholder_likely={counts['PLACEHOLDER_LIKELY']} "
              f"synthetic_likely={counts['SYNTHETIC_LIKELY']} "
              f"suspicious_requires_review={counts['SUSPICIOUS_REQUIRES_REVIEW']}"
          )
          if len(findings) != 9:
              raise SystemExit(f"DIAGNOSTIC_FAIL expected=9 observed={len(findings)}")
          print("HISTORY_CREDENTIAL_DIAGNOSTIC=PASS_REDACTED")
          PY

      - name: Confirm diagnostic made no repository changes
        shell: bash
        run: |
          git status --short
          test -z "$(git status --porcelain)"
