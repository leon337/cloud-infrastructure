name: self-hosted-static-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-static-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-validate:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10

    steps:
      - name: Check out exact validation state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify unprivileged boundary
        run: |
          id
          python3 --version
          if sudo -n true 2>/dev/null; then
            echo 'SELF_HOSTED_STATIC_CI_REFUSED: unexpected passwordless sudo' >&2
            exit 1
          fi
          echo 'SELF_HOSTED_STATIC_CI_BOUNDARY_PASS: no passwordless sudo'

      - name: Probe existing unprivileged isolation capabilities
        run: |
          for cmd in qemu-system-x86_64 cloud-hypervisor firecracker systemd-nspawn bwrap podman docker unshare; do
            if path=$(command -v "$cmd" 2>/dev/null); then
              printf 'ISOLATION_TOOL_PRESENT %s=%s\n' "$cmd" "$path"
            else
              printf 'ISOLATION_TOOL_ABSENT %s\n' "$cmd"
            fi
          done
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo 'KVM_ACCESS=read-write'
          elif [[ -e /dev/kvm ]]; then
            ls -l /dev/kvm || true
            echo 'KVM_ACCESS=present-but-not-read-write'
          else
            echo 'KVM_ACCESS=absent'
          fi
          if [[ -S /var/run/docker.sock ]]; then
            ls -l /var/run/docker.sock || true
            if [[ -r /var/run/docker.sock && -w /var/run/docker.sock ]]; then
              echo 'DOCKER_SOCKET_ACCESS=read-write'
            else
              echo 'DOCKER_SOCKET_ACCESS=present-but-not-read-write'
            fi
          else
            echo 'DOCKER_SOCKET_ACCESS=absent'
          fi

      - name: Provision pinned ShellCheck in runner temp
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "${SHELLCHECK_SHA256}" "${archive}" | sha256sum --check
          tar -xJf "${archive}" -C "${RUNNER_TEMP}"
          printf '%s\n' "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}" >> "${GITHUB_PATH}"

      - name: Run repository static validation without privileged installs
        env:
          PYTHON: python3
          REQUIRE_ANSIBLE: "0"
          REQUIRE_SHELLCHECK: "1"
        run: scripts/test.sh

      - name: Confirm checkout remains repository-local
        if: always()
        run: |
          git status --short
          echo 'SELF_HOSTED_STATIC_CI_COMPLETE'
