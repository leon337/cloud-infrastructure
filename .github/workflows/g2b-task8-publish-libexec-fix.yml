name: g2b-task8-publish-libexec-fix

on:
  push:
    branches:
      - ops/r8-task7-syntax-selfhosted-20260822

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Publish guarded G2-B candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=/home/ubuntu/cloud-infrastructure
          branch=codex/control-bridge-g2b
          expected_local=00eebb56ee2262d5879497c1405364f044553dd0
          expected_tree=94accd46f9b4d7c51b972e6b39972a2aced70f3e
          expected_remote=e6aba995cbee69e1cb1e37ea954b94d4fa92082c
          cd "$repo"
          test "$(git branch --show-current)" = "$branch"
          test "$(git rev-parse HEAD)" = "$expected_local"
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          test -z "$(git status --porcelain)"
          auth="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote="$(git ls-remote "$auth" "refs/heads/$branch" | cut -f1)"
          test "$remote" = "$expected_remote"
          git fetch --no-tags "$auth" "refs/heads/$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$expected_remote"
          export GIT_AUTHOR_NAME='MCF Release Transport'
          export GIT_AUTHOR_EMAIL='noreply@local.invalid'
          export GIT_COMMITTER_NAME='MCF Release Transport'
          export GIT_COMMITTER_EMAIL='noreply@local.invalid'
          new="$(printf '%s\n' 'fix(g2b): create libexec parent in disposable bootstrap' | git commit-tree "$expected_tree" -p "$expected_remote")"
          git push "$auth" "$new:refs/heads/$branch"
          test "$(git ls-remote "$auth" "refs/heads/$branch" | cut -f1)" = "$new"
          git update-ref "refs/heads/$branch" "$new" "$expected_local"
          git update-ref "refs/remotes/origin/$branch" "$new"
          test "$(git rev-parse HEAD)" = "$new"
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          test -z "$(git status --porcelain)"
          printf 'PUBLISHED_SHA=%s\n' "$new"
