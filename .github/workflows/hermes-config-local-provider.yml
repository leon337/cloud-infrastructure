name: hermes-config-local-provider

on:
  push:
    branches:
      - mcf/hermes-relay-bootstrap-20260823

permissions:
  contents: read

jobs:
  configure:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10
    steps:
      - name: Configure local provider as ubuntu
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = ubuntu
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8080/health)" = 200
          export HOME=/home/ubuntu
          py="$HOME/.hermes/hermes-agent/.venv/bin/python"
          "$py" - <<'PY'
          from pathlib import Path
          import os,tempfile,yaml
          p=Path('/home/ubuntu/.hermes/config.yaml')
          cfg=yaml.safe_load(p.read_text()) if p.exists() else {}
          if not isinstance(cfg,dict): cfg={}
          model=cfg.get('model')
          if not isinstance(model,dict): model={}
          model.update({'default':'qwen3-4b-instruct-2507','provider':'custom','base_url':'http://127.0.0.1:8080/v1','api_key':'no-key','context_length':65536})
          cfg['model']=model
          fd,tmp=tempfile.mkstemp(prefix='config.',suffix='.yaml',dir=str(p.parent)); os.close(fd)
          Path(tmp).write_text(yaml.safe_dump(cfg,sort_keys=False,allow_unicode=True))
          os.chmod(tmp,0o600); os.replace(tmp,p)
          print('CONFIG_WRITE=PASS')
          PY
          "$HOME/.local/bin/hermes" config get model --json || true

      - name: Cognitive smoke
        shell: bash
        run: |
          set -euo pipefail
          export HOME=/home/ubuntu
          export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"
          out=$(timeout 300 "$HOME/.local/bin/hermes" -z 'Reply with exactly HERMES_READY and nothing else.' --ignore-rules)
          printf '%s\n' "$out"
          test "$out" = HERMES_READY
          echo COGNITIVE_SMOKE=PASS
