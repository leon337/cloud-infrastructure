name: vps-g2b-attempt3-audit-once

on:
  push:
    branches:
      - codex/vps-state-reconciliation-20260822
    paths:
      - .github/workflows/vps-g2b-attempt3-audit-once.yml

permissions:
  contents: read

concurrency:
  group: vps-g2b-attempt3-audit-once
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 3
    steps:
      - name: Inspect active disposable VM without mutation
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import re
          import socket
          import subprocess

          process_name = "g2b-disposable-task8-vm3"
          matches = []
          for proc in pathlib.Path("/proc").iterdir():
              if not proc.name.isdigit():
                  continue
              try:
                  argv = (proc / "cmdline").read_bytes().split(b"\0")
              except (FileNotFoundError, PermissionError, ProcessLookupError):
                  continue
              decoded = [item.decode("utf-8", "replace") for item in argv if item]
              if process_name not in decoded:
                  continue
              matches.append({"pid": int(proc.name), "argv": decoded})

          def safe_workdir(argv):
              for option in ("-pidfile",):
                  if option not in argv:
                      continue
                  index = argv.index(option)
                  if index + 1 >= len(argv):
                      continue
                  candidate = pathlib.Path(argv[index + 1]).parent.resolve()
                  if candidate.parent == pathlib.Path("/tmp") and candidate.name.startswith(
                      "g2b-task8-vm3."
                  ):
                      return candidate
              return None

          def sanitized_tail(path, line_limit=160):
              if not path.is_file():
                  return None
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
              sensitive = re.compile(
                  r"(?i)(private[ _-]?key|password|passwd|authorization:|bearer |token=|secret=)"
              )
              return ["[REDACTED]" if sensitive.search(line) else line for line in lines[-line_limit:]]

          def run(argv, timeout=30):
              try:
                  result = subprocess.run(
                      argv,
                      check=False,
                      capture_output=True,
                      text=True,
                      timeout=timeout,
                  )
                  return {
                      "exit_code": result.returncode,
                      "stdout": result.stdout[-16000:],
                      "stderr": result.stderr[-4000:],
                  }
              except (OSError, subprocess.TimeoutExpired) as exc:
                  return {
                      "exit_code": 124 if isinstance(exc, subprocess.TimeoutExpired) else 127,
                      "stdout": "",
                      "stderr": str(exc),
                  }

          inspected = []
          for match in matches:
              workdir = safe_workdir(match["argv"])
              item = {
                  "pid": match["pid"],
                  "cmdline": match["argv"],
                  "workdir": str(workdir) if workdir else None,
              }
              if workdir and workdir.is_dir():
                  entries = []
                  for entry in sorted(workdir.iterdir(), key=lambda value: value.name):
                      stat = entry.lstat()
                      entries.append(
                          {
                              "name": entry.name,
                              "type": "dir" if entry.is_dir() else "file",
                              "mode": oct(stat.st_mode & 0o777),
                              "size": stat.st_size,
                              "mtime_utc": datetime.datetime.fromtimestamp(
                                  stat.st_mtime, datetime.timezone.utc
                              )
                              .replace(microsecond=0)
                              .isoformat()
                              .replace("+00:00", "Z"),
                          }
                      )
                  item["entries"] = entries
                  item["log_tails"] = {
                      name: sanitized_tail(workdir / name)
                      for name in [
                          "serial.log",
                          "harness.log",
                          "guest.log",
                          "result.log",
                          "run.log",
                      ]
                  }
                  item["control_files"] = {
                      name: sanitized_tail(workdir / name)
                      for name in ["run-task8.sh", "resource-watch.sh"]
                  }
              inspected.append(item)

          ssh_banner = {"reachable": False, "banner": ""}
          try:
              with socket.create_connection(("127.0.0.1", 22284), timeout=3) as connection:
                  ssh_banner["reachable"] = True
                  connection.settimeout(3)
                  ssh_banner["banner"] = connection.recv(256).decode("ascii", "replace").strip()
          except OSError as exc:
              ssh_banner["error"] = str(exc)

          guest_state = None
          if inspected and inspected[0].get("workdir") and ssh_banner["reachable"]:
              workdir = pathlib.Path(inspected[0]["workdir"])
              identity_file = workdir / "id_ed25519"
              if identity_file.is_file() and (identity_file.stat().st_mode & 0o777) == 0o600:
                  guest_command = """
                  set -u
                  printf '%s\n' 'GUEST_IDENTITY'
                  id
                  hostname
                  printf '%s\n' 'KNOWN_STATUS_FILES'
                  for file in \
                    /home/ubuntu/g2b-task8.status \
                    /home/ubuntu/g2b-task8.log \
                    /home/ubuntu/g2b-resource-watch.log; do
                    if test -f "$file"; then
                      stat -c '%n|%s|%y' "$file"
                      tail -n 120 "$file"
                    else
                      printf '%s|ABSENT\n' "$file"
                    fi
                  done
                  printf '%s\n' 'RELATED_PROCESSES'
                  pgrep -af 'test_control_bridge_g2b|ansible-playbook|docker build|resource-watch' || true
                  printf '%s\n' 'REPOSITORY_STATE'
                  if test -d /home/ubuntu/cloud-infrastructure/.git; then
                    git -C /home/ubuntu/cloud-infrastructure rev-parse HEAD
                    git -C /home/ubuntu/cloud-infrastructure status --short --branch
                  else
                    printf '%s\n' 'repository_absent'
                  fi
                  """
                  guest_state = run(
                      [
                          "ssh",
                          "-i",
                          str(identity_file),
                          "-p",
                          "22284",
                          "-o",
                          "BatchMode=yes",
                          "-o",
                          "StrictHostKeyChecking=no",
                          "-o",
                          "UserKnownHostsFile=/dev/null",
                          "-o",
                          "ConnectTimeout=5",
                          "ubuntu@127.0.0.1",
                          "/bin/bash",
                          "-lc",
                          guest_command,
                      ],
                      timeout=90,
                  )

          payload = {
              "protocol": "G2B_ATTEMPT3_READ_ONLY_AUDIT_V1",
              "captured_at_utc": datetime.datetime.now(datetime.timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z"),
              "qemu_process_count": len(matches),
              "qemu": inspected,
              "guest_ssh_banner": ssh_banner,
              "guest_read_only_state": guest_state,
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
