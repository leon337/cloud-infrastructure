name: vps-g2b-attempt3-audit-once

on:
  push:
    branches:
      - codex/vps-state-reconciliation-20260822
    paths:
      - .github/workflows/vps-g2b-attempt3-audit-once.yml

permissions:
  contents: read

concurrency:
  group: vps-g2b-attempt3-audit-once
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 3
    steps:
      - name: Inspect active disposable VM without mutation
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import re
          import socket

          process_name = "g2b-disposable-task8-vm3"
          matches = []
          for proc in pathlib.Path("/proc").iterdir():
              if not proc.name.isdigit():
                  continue
              try:
                  argv = (proc / "cmdline").read_bytes().split(b"\0")
              except (FileNotFoundError, PermissionError, ProcessLookupError):
                  continue
              decoded = [item.decode("utf-8", "replace") for item in argv if item]
              if process_name not in decoded:
                  continue
              matches.append({"pid": int(proc.name), "argv": decoded})

          def safe_workdir(argv):
              for option in ("-pidfile",):
                  if option not in argv:
                      continue
                  index = argv.index(option)
                  if index + 1 >= len(argv):
                      continue
                  candidate = pathlib.Path(argv[index + 1]).parent.resolve()
                  if candidate.parent == pathlib.Path("/tmp") and candidate.name.startswith(
                      "g2b-task8-vm3."
                  ):
                      return candidate
              return None

          def sanitized_tail(path, line_limit=160):
              if not path.is_file():
                  return None
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
              sensitive = re.compile(
                  r"(?i)(private[ _-]?key|password|passwd|authorization:|bearer |token=|secret=)"
              )
              return ["[REDACTED]" if sensitive.search(line) else line for line in lines[-line_limit:]]

          inspected = []
          for match in matches:
              workdir = safe_workdir(match["argv"])
              item = {
                  "pid": match["pid"],
                  "cmdline": match["argv"],
                  "workdir": str(workdir) if workdir else None,
              }
              if workdir and workdir.is_dir():
                  entries = []
                  for entry in sorted(workdir.iterdir(), key=lambda value: value.name):
                      stat = entry.lstat()
                      entries.append(
                          {
                              "name": entry.name,
                              "type": "dir" if entry.is_dir() else "file",
                              "mode": oct(stat.st_mode & 0o777),
                              "size": stat.st_size,
                              "mtime_utc": datetime.datetime.fromtimestamp(
                                  stat.st_mtime, datetime.timezone.utc
                              )
                              .replace(microsecond=0)
                              .isoformat()
                              .replace("+00:00", "Z"),
                          }
                      )
                  item["entries"] = entries
                  item["log_tails"] = {
                      name: sanitized_tail(workdir / name)
                      for name in [
                          "serial.log",
                          "harness.log",
                          "guest.log",
                          "result.log",
                          "run.log",
                      ]
                  }
              inspected.append(item)

          ssh_banner = {"reachable": False, "banner": ""}
          try:
              with socket.create_connection(("127.0.0.1", 22284), timeout=3) as connection:
                  ssh_banner["reachable"] = True
                  connection.settimeout(3)
                  ssh_banner["banner"] = connection.recv(256).decode("ascii", "replace").strip()
          except OSError as exc:
              ssh_banner["error"] = str(exc)

          payload = {
              "protocol": "G2B_ATTEMPT3_READ_ONLY_AUDIT_V1",
              "captured_at_utc": datetime.datetime.now(datetime.timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z"),
              "qemu_process_count": len(matches),
              "qemu": inspected,
              "guest_ssh_banner": ssh_banner,
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
