name: g2b-task8-diag-start-once

on:
  push:
    branches:
      - team/g2b-task8-20260822
    paths:
      - .github/workflows/g2b-task8-diag-start-once.yml

permissions:
  contents: read

jobs:
  start-diagnostic:
    if: github.actor == 'leon337'
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 5
    steps:
      - name: Start detached diagnostic reproduction inside preserved disposable VM
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'G2B_TASK8_DIAG_START_V1'
          candidate=fbef3d407dbd9b7947b6c100a63d098eaebe2b6a
          qemu_pid="$(pgrep -f 'qemu-system-x86_64.*g2b-disposable-task8-vm3' | head -1 || true)"
          [[ -n "$qemu_pid" ]] || { echo 'attempt3_qemu=ABSENT'; exit 2; }
          cmdline="$(tr '\0' ' ' <"/proc/$qemu_pid/cmdline")"
          workdir="$(sed -nE 's#.*-pidfile (/tmp/g2b-task8-vm3\.[^ /]+/qemu\.pid).*#\1#p' <<<"$cmdline" | xargs -r dirname)"
          [[ -n "$workdir" && "$workdir" == /tmp/g2b-task8-vm3.* ]] || { echo 'safe_workdir=INVALID'; exit 3; }
          key="$workdir/id_ed25519"
          archive="$workdir/candidate.tar.gz"
          [[ -f "$key" && "$(stat -c '%a' "$key")" == 600 ]] || { echo 'identity_file=INVALID'; exit 4; }
          [[ -f "$archive" ]] || { echo 'candidate_archive=ABSENT'; exit 5; }
          echo "attempt3_qemu=ALIVE pid=$qemu_pid"
          echo "candidate_archive_size=$(stat -c '%s' "$archive")"
          echo "candidate_archive_sha256=$(sha256sum "$archive" | awk '{print $1}')"

          ssh_opts=(-i "$key" -p 22284 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5)
          ssh "${ssh_opts[@]}" ubuntu@127.0.0.1 'printf "guest_ready="; hostname --short; test -S /var/run/docker.sock; printf "docker_socket_rc=%s\n" "$?"'

          remote_archive=/tmp/g2b-task8-diagnostic-candidate.tar.gz
          scp "${ssh_opts[@]}" "$archive" "ubuntu@127.0.0.1:$remote_archive" >/dev/null

          ssh "${ssh_opts[@]}" ubuntu@127.0.0.1 /bin/bash -s -- "$candidate" "$remote_archive" <<'GUEST'
          set -Eeuo pipefail
          candidate=$1
          archive=$2
          state_dir=/home/ubuntu/.local/state
          mkdir -p "$state_dir"
          pid_file="$state_dir/g2b-task8-diagnostic.pid"
          if [[ -f "$pid_file" ]]; then
            old_pid="$(cat "$pid_file" 2>/dev/null || true)"
            if [[ -n "$old_pid" && -d "/proc/$old_pid" ]]; then
              echo "diagnostic_already_running pid=$old_pid"
              exit 0
            fi
          fi

          diag_root="$(mktemp -d /tmp/g2b-task8-diagnostic.XXXXXXXX)"
          tar -xzf "$archive" -C "$diag_root"
          harness="$(find "$diag_root" -maxdepth 4 -type f -path '*/scripts/test_control_bridge_g2b_vm.sh' -print -quit)"
          [[ -n "$harness" ]] || { echo 'diagnostic_harness=NOT_FOUND'; exit 6; }
          repo_root="$(cd "$(dirname "$harness")/.." && pwd)"

          python3 - "$harness" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = '''CURRENT_STAGE=apply_g2b
          run_playbook playbooks/apply-control-bridge-g2b.yml >/dev/null
          run_playbook playbooks/apply-control-bridge-g2b.yml >/dev/null
          '''
          new = '''CURRENT_STAGE=apply_g2b
          printf '%s\\n' 'G2B_DIAG_APPLY_INVOCATION=1'
          run_playbook playbooks/apply-control-bridge-g2b.yml
          printf '%s\\n' 'G2B_DIAG_APPLY_INVOCATION_1=PASS'
          printf '%s\\n' 'G2B_DIAG_APPLY_INVOCATION=2'
          run_playbook playbooks/apply-control-bridge-g2b.yml
          printf '%s\\n' 'G2B_DIAG_APPLY_INVOCATION_2=PASS'
          '''
          if text.count(old) != 1:
              raise SystemExit('apply_block_match_failed')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          runner="$diag_root/run-diagnostic.sh"
          cat >"$runner" <<RUNNER
          #!/usr/bin/env bash
          set +e
          cd "$repo_root"
          (
            for _ in \$(seq 1 900); do
              c=\$(docker ps --format '{{.Names}}' | grep '^control-bridge-g2b-test-' | head -1 || true)
              if [[ -n "\$c" ]]; then
                docker update --cpus 5 --memory 8g --memory-swap 8g "\$c" >/dev/null 2>&1 && {
                  printf 'RESOURCE_UPDATE_PASS container=%s cpus=5 memory=8g\\n' "\$c" >> /home/ubuntu/g2b-task8-diagnostic.log
                  exit 0
                }
              fi
              sleep 2
            done
          ) &
          watcher=\$!
          G2B_TEST_PRIVILEGED_CONFIRM=DISPOSABLE_UBUNTU_24_04_ONLY G2B_CANDIDATE_SHA=$candidate "$harness" >> /home/ubuntu/g2b-task8-diagnostic.log 2>&1
          rc=\$?
          kill "\$watcher" >/dev/null 2>&1 || true
          wait "\$watcher" >/dev/null 2>&1 || true
          printf '%s\\n' "\$rc" > /home/ubuntu/g2b-task8-diagnostic.status
          printf 'G2B_TASK8_DIAGNOSTIC_EXIT=%s\\n' "\$rc" >> /home/ubuntu/g2b-task8-diagnostic.log
          rm -f -- "$archive"
          exit "\$rc"
          RUNNER
          chmod 0700 "$runner"
          : > /home/ubuntu/g2b-task8-diagnostic.log
          rm -f /home/ubuntu/g2b-task8-diagnostic.status
          printf '%s\n' "$diag_root" > "$state_dir/g2b-task8-diagnostic.root"
          nohup "$runner" </dev/null >/home/ubuntu/g2b-task8-diagnostic.nohup 2>&1 &
          diag_pid=$!
          printf '%s\n' "$diag_pid" > "$pid_file"
          echo "diagnostic_started pid=$diag_pid root=$diag_root"
          GUEST
