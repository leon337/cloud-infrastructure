name: mestre-terminal-probe

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - control/dispatch/terminal-probe.txt

permissions:
  contents: read
  issues: write

jobs:
  terminal:
    if: >-
      github.actor == 'leon337' &&
      ((github.event_name == 'issues' && github.event.issue.title == '[VPS-TERMINAL] hell word') ||
       (github.event_name == 'pull_request' && github.head_ref == 'mcf/terminal-hell-word-main-test'))
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 5
    steps:
      - name: Open bounded bash terminal and type hell word
        id: terminal
        shell: bash
        run: |
          output="$(printf 'hell word\n')"
          printf '%s\n' "$output"
          {
            echo 'terminal_output<<EOF'
            printf '%s\n' "$output"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish terminal proof to triggering issue
        if: github.event_name == 'issues'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          TERMINAL_OUTPUT: ${{ steps.terminal.outputs.terminal_output }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY']
          issue_number = os.environ['ISSUE_NUMBER']
          terminal_output = os.environ['TERMINAL_OUTPUT']
          payload = json.dumps({
              'body': (
                  '## NODE-01 terminal proof\n\n'
                  '- runner: `self-hosted / node-01 / mcf-control`\n'
                  '- shell: `/bin/bash`\n'
                  '- exit: `0`\n'
                  f'- output: `{terminal_output}`\n'
              )
          }).encode('utf-8')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/issues/{issue_number}/comments',
              data=payload,
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f'publish_failed:{response.status}')
          PY
