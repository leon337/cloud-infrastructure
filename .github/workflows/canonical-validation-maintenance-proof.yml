name: canonical-validation-maintenance-proof

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-validation-maintenance-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'team/canonical-state-toolchain-')
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out exact validation state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify maintenance proof boundary
        shell: bash
        run: |
          set -euo pipefail
          id
          if sudo -n true 2>/dev/null; then
            echo 'CANONICAL_PROOF_REFUSED reason=unexpected_passwordless_sudo' >&2
            exit 1
          fi
          if [[ -r /var/run/docker.sock && -w /var/run/docker.sock ]]; then
            echo 'CANONICAL_PROOF_REFUSED reason=writable_docker_socket' >&2
            exit 1
          fi
          python3 - <<'PY'
          import yaml
          major = int(yaml.__version__.split('.', 1)[0])
          if major != 6:
              raise SystemExit(f'unsupported PyYAML major: {yaml.__version__}')
          print('PYYAML_COMPATIBLE', yaml.__version__)
          PY
          echo 'CANONICAL_MAINTENANCE_PROOF_BOUNDARY=PASS'

      - name: Provision pinned ShellCheck in runner temp
        shell: bash
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      - name: Run exact canonical suite
        id: canonical_suite
        continue-on-error: true
        shell: bash
        env:
          PYTHON: python3
          REQUIRE_SHELLCHECK: "1"
          VALIDATION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/test.sh

      - name: Collect targeted state and consistency evidence
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA"...HEAD
            echo "TARGETED_GIT_DIFF_CHECK_PASS base=$BASE_SHA"
          else
            git diff --check
            echo 'TARGETED_GIT_DIFF_CHECK_PASS base=working-tree'
          fi

          python3 scripts/check_markdown_links.py
          python3 scripts/validate_yaml.py
          python3 scripts/validate_state.py
          python3 scripts/check_canonical_consistency.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(["git", "ls-files", "*.py"], text=True).splitlines()
          for path_text in paths:
              compile(Path(path_text).read_text(encoding="utf-8"), path_text, "exec")
          print(f"TARGETED_PYTHON_SYNTAX_PASS count={len(paths)}")
          PY

          shell_scripts=()
          shell_script_count=0
          while IFS= read -r -d '' path; do
            [[ -f "$path" ]] || continue
            IFS= read -r first_line < "$path" || true
            case "$first_line" in
              '#!'*bash*) bash -n "$path" ;;
              '#!'*/sh | '#!'*' sh') sh -n "$path" ;;
              *) continue ;;
            esac
            shell_scripts+=("$path")
            shell_script_count=$((shell_script_count + 1))
          done < <(git ls-files -z)
          if ((${#shell_scripts[@]} > 0)); then
            shellcheck "${shell_scripts[@]}"
          fi
          echo "TARGETED_SHELL_VALIDATION_PASS count=$shell_script_count"
          echo 'TARGETED_STATE_CONSISTENCY_PASS'

      - name: Confirm workspace stayed clean
        if: always()
        shell: bash
        run: |
          git status --short
          test -z "$(git status --porcelain)"

      - name: Preserve canonical suite verdict
        if: always()
        shell: bash
        run: |
          if [[ '${{ steps.canonical_suite.outcome }}' != 'success' ]]; then
            echo 'CANONICAL_SUITE_FINAL=FAIL'
            exit 1
          fi
          echo 'CANONICAL_SUITE_FINAL=PASS'
