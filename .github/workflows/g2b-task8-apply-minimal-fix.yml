name: g2b-task8-apply-minimal-fix

on:
  pull_request:
    branches:
      - codex/control-bridge-g2b
    paths:
      - .github/workflows/g2b-task8-apply-minimal-fix.yml

permissions:
  contents: write

jobs:
  apply-minimal-fix:
    if: >-
      github.actor == 'leon337' &&
      github.event.pull_request.number == 21 &&
      github.event.pull_request.head.ref == 'team/g2b-task8-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: team/g2b-task8-20260822
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact proven Task 8 fix and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('automation/ansible/roles/control_bridge_g2b/tasks/main.yml')
          text = p.read_text(encoding='utf-8')
          old = """    - name: Verify ubuntu direct write is denied by the protected parent
              ansible.builtin.command:
                argv: [test, '!', -w, \"{{ g2b_workspace_path }}\"]
              become: true
              become_user: ubuntu
              changed_when: false
              check_mode: false
          """
          new = """    - name: Verify ubuntu direct write is denied by the protected parent
              ansible.builtin.command:
                argv: [sudo, -n, -u, ubuntu, --, test, '!', -w, \"{{ g2b_workspace_path }}\"]
              changed_when: false
              check_mode: false
          """
          if text.count(old) != 1:
              raise SystemExit(f'G2B_TASK8_FIX_BLOCK_MATCH_FAILED count={text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- automation/ansible/roles/control_bridge_g2b/tasks/main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/ansible/roles/control_bridge_g2b/tasks/main.yml
          git commit -m 'G2-B Task 8: run direct-write proof explicitly as ubuntu'
          git push origin HEAD:team/g2b-task8-20260822
