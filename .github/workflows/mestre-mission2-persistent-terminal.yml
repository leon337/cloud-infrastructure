name: mestre-mission2-persistent-terminal

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  mission2:
    if: github.actor == 'leon337' && github.event.issue.title == '[VPS-TERMINAL] MISSION2 persistent Hello World'
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 5

    steps:
      - name: Leave a persistent terminal open with Hello World
        id: terminal
        shell: bash
        run: |
          set -euo pipefail

          unit="mcf-mission2-hello-terminal.service"
          mode=""
          evidence=""

          systemctl --user stop "$unit" >/dev/null 2>&1 || true
          systemctl --user reset-failed "$unit" >/dev/null 2>&1 || true

          xfce_pid="$(pgrep -u "$(id -u)" -n xfce4-session || true)"
          if command -v xfce4-terminal >/dev/null 2>&1 && [ -n "$xfce_pid" ] && [ -r "/proc/$xfce_pid/environ" ]; then
            session_env="$(tr '\0' '\n' < "/proc/$xfce_pid/environ")"
            display="$(printf '%s\n' "$session_env" | sed -n 's/^DISPLAY=//p' | tail -n1)"
            dbus="$(printf '%s\n' "$session_env" | sed -n 's/^DBUS_SESSION_BUS_ADDRESS=//p' | tail -n1)"
            xauth="$(printf '%s\n' "$session_env" | sed -n 's/^XAUTHORITY=//p' | tail -n1)"

            if [ -n "$display" ] && [ -n "$dbus" ]; then
              args=(--user --unit="$unit" --collect --setenv="DISPLAY=$display" --setenv="DBUS_SESSION_BUS_ADDRESS=$dbus")
              if [ -n "$xauth" ]; then
                args+=(--setenv="XAUTHORITY=$xauth")
              fi

              systemd-run "${args[@]}" \
                /usr/bin/xfce4-terminal \
                --disable-server \
                --title='MCF Mission 2 — Hello World' \
                --hold \
                --command="/bin/bash -lc 'printf \"Hello World\\n\"; exec /bin/bash'"
              sleep 3
              if systemctl --user is-active --quiet "$unit"; then
                mode="XFCE_GUI"
                evidence="$(systemctl --user show "$unit" -p ActiveState -p SubState -p MainPID --no-pager | tr '\n' ' ')"
              fi
            fi
          fi

          if [ -z "$mode" ] && command -v tmux >/dev/null 2>&1; then
            systemctl --user stop "$unit" >/dev/null 2>&1 || true
            systemd-run --user --unit="$unit" --collect \
              /usr/bin/tmux -D new-session -s mcf-mission2-hello \
              "/bin/bash -lc 'printf \"Hello World\\n\"; exec /bin/bash'"
            sleep 2
            if systemctl --user is-active --quiet "$unit"; then
              mode="TMUX"
              evidence="$(systemctl --user show "$unit" -p ActiveState -p SubState -p MainPID --no-pager | tr '\n' ' ')"
            fi
          fi

          if [ -z "$mode" ]; then
            echo "No supported persistent terminal path became active" >&2
            exit 1
          fi

          {
            echo "mode=$mode"
            echo "unit=$unit"
            echo "evidence=$evidence"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Mission 2 proof
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          MODE: ${{ steps.terminal.outputs.mode }}
          UNIT: ${{ steps.terminal.outputs.unit }}
          EVIDENCE: ${{ steps.terminal.outputs.evidence }}
          OUTCOME: ${{ steps.terminal.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          ok = os.environ.get('OUTCOME') == 'success'
          body = (
              '## MCF Mission 2 — Persistent terminal\n\n'
              f'- status: `{"PASS" if ok else "FAIL"}`\n'
              f'- runner: `self-hosted / node-01 / mcf-control`\n'
              f'- mode: `{os.environ.get("MODE") or "NONE"}`\n'
              f'- unit: `{os.environ.get("UNIT") or "NONE"}`\n'
              '- terminal_text: `Hello World`\n'
              f'- persistence: `{os.environ.get("EVIDENCE") or "NOT_VERIFIED"}`\n'
          )
          payload = json.dumps({'body': body}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments",
              data=payload,
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status not in (200, 201):
                  raise SystemExit(response.status)
          PY
