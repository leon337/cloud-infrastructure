name: mestre-mission2-persistent-terminal

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.actor == 'leon337' && github.event.issue.title == '[VPS-TERMINAL] MISSION2 verify persistence'
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 5

    steps:
      - name: Verify persistent PTY from an independent job
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          pid_file="$HOME/.local/state/mcf-mission2-terminal.pid"
          socket_path="/run/user/$(id -u)/mcf-mission2-terminal.sock"
          pid="$(cat "$pid_file" 2>/dev/null || true)"

          [ -n "$pid" ]
          kill -0 "$pid"
          [ -S "$socket_path" ]
          [ "$(stat -c '%a' "$socket_path")" = '600' ]

          verify="$(SOCKET_PATH="$socket_path" python3 - <<'PY'
          import os, socket, time
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.settimeout(2)
          s.connect(os.environ['SOCKET_PATH'])
          chunks = []
          end = time.time() + 2
          while time.time() < end:
              try:
                  data = s.recv(4096)
              except socket.timeout:
                  break
              if not data:
                  break
              chunks.append(data)
              if b'Hello World' in b''.join(chunks):
                  break
          s.close()
          text = b''.join(chunks).decode('utf-8', 'replace')
          print('HELLO_WORLD_PRESENT=YES' if 'Hello World' in text else 'HELLO_WORLD_PRESENT=NO')
          PY
          )"
          [ "$verify" = 'HELLO_WORLD_PRESENT=YES' ]

          {
            echo "pid=$pid"
            echo "socket=$socket_path"
            echo "verify=$verify"
          } >> "$GITHUB_OUTPUT"

      - name: Publish independent verification
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          PID: ${{ steps.verify.outputs.pid }}
          SOCKET: ${{ steps.verify.outputs.socket }}
          VERIFY: ${{ steps.verify.outputs.verify }}
          OUTCOME: ${{ steps.verify.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          ok = os.environ.get('OUTCOME') == 'success'
          body = (
              '## MCF Mission 2 — Independent persistence verification\n\n'
              f'- status: `{"PASS" if ok else "FAIL"}`\n'
              '- runner: `self-hosted / node-01 / mcf-control`\n'
              f'- pid: `{os.environ.get("PID") or "NONE"}`\n'
              f'- socket: `{os.environ.get("SOCKET") or "NONE"}`\n'
              f'- terminal_text: `Hello World`\n'
              f'- verification: `{os.environ.get("VERIFY") or "NOT_VERIFIED"}`\n'
          )
          payload = json.dumps({'body': body}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments",
              data=payload,
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status not in (200, 201):
                  raise SystemExit(response.status)
          PY
