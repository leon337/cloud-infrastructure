name: foundation-ci

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out desired state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Install required shell validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Validate schemas, policy, units and Ansible
        id: repository-validation
        env:
          PYTHON: python
          REQUIRE_ANSIBLE: "1"
          REQUIRE_SHELLCHECK: "1"
        run: scripts/test.sh

      - name: Publish canonical mission status summary
        if: always()
        env:
          TESTS_RESULT: ${{ steps.repository-validation.outcome == 'success' && 'PASS' || 'FAIL' }}
        run: |
          python scripts/generate_project_status.py \
            --check-readme \
            --summary "${GITHUB_STEP_SUMMARY}" \
            --tests-result "${TESTS_RESULT}" \
            --commit "${GITHUB_SHA}" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

  disposable-integration:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the complete tested history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove disposable apply, idempotence and rollback
        env:
          FOUNDATION_TEST_PRIVILEGED_CONFIRM: DISPOSABLE_VM_ONLY
        run: scripts/test_foundation_container.sh
