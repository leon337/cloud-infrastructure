name: hermes-config-diagnostic

on:
  push:
    branches:
      - mcf/hermes-relay-bootstrap-20260823

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: mcf/hermes-relay-bootstrap-20260823
          fetch-depth: 0
      - name: Collect sanitized Hermes model state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/hermes-relay-bootstrap
          out=artifacts/hermes-relay-bootstrap/config-diagnostic.txt
          export HOME=/home/ubuntu
          py="$HOME/.hermes/hermes-agent/.venv/bin/python"
          {
            echo "UTC=$(date -u +%FT%TZ)"
            "$py" - <<'PY'
          from pathlib import Path
          import yaml, json
          p=Path('/home/ubuntu/.hermes/config.yaml')
          print('CONFIG_EXISTS='+('yes' if p.exists() else 'no'))
          if p.exists():
              cfg=yaml.safe_load(p.read_text()) or {}
              model=cfg.get('model')
              if isinstance(model,dict):
                  model=dict(model)
                  if 'api_key' in model: model['api_key']='REDACTED_PRESENT'
              print('MODEL_YAML='+json.dumps(model,sort_keys=True,ensure_ascii=False))
          PY
            echo '--- CONFIG_GET_MODEL ---'
            "$HOME/.local/bin/hermes" config get model --json 2>&1 || true
            echo '--- STATUS ---'
            "$HOME/.local/bin/hermes" status 2>&1 | sed -E 's/(key|token|secret|password)([=: ]+)[^ ]+/\1\2REDACTED/Ig' | head -100 || true
          } > "$out"
          cat "$out"
      - name: Persist diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mcf-hermes-diagnostic'
          git config user.email 'mcf-hermes-diagnostic@users.noreply.github.com'
          git add artifacts/hermes-relay-bootstrap/config-diagnostic.txt
          git commit -m 'chore: record sanitized Hermes config diagnostic [skip ci]' || exit 0
          git pull --rebase origin mcf/hermes-relay-bootstrap-20260823
          git push origin HEAD:mcf/hermes-relay-bootstrap-20260823
