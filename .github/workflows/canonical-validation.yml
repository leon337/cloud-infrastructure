name: canonical-validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact validation state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked neutral validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Install required shell validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Run canonical repository suite
        env:
          PYTHON: python
          REQUIRE_SHELLCHECK: "1"
          VALIDATION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/test.sh

      - name: Confirm workspace stayed clean
        if: always()
        run: |
          git status --short
          test -z "$(git status --porcelain)"
