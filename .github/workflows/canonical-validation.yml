name: canonical-validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'team/canonical-state-toolchain-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 5

    steps:
      - name: Check out exact validation state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify unprivileged validation boundary
        shell: bash
        run: |
          set -euo pipefail
          id
          if sudo -n true 2>/dev/null; then
            echo 'CANONICAL_VALIDATION_REFUSED reason=unexpected_passwordless_sudo' >&2
            exit 1
          fi
          if [[ -r /var/run/docker.sock && -w /var/run/docker.sock ]]; then
            echo 'CANONICAL_VALIDATION_REFUSED reason=writable_docker_socket' >&2
            exit 1
          fi
          python3 -c 'import yaml; print("PYYAML_AVAILABLE", yaml.__version__)'
          echo 'CANONICAL_VALIDATION_BOUNDARY=PASS'

      - name: Provision pinned ShellCheck in runner temp
        shell: bash
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      - name: Run canonical repository suite
        shell: bash
        env:
          REQUIRE_SHELLCHECK: '1'
          VALIDATION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/test.sh

      - name: Confirm workspace stayed clean
        if: always()
        shell: bash
        run: |
          git status --short
          test -z "$(git status --porcelain)"
