name: g2b-task8-repro-result-once

on:
  push:
    branches:
      - team/g2b-task8-20260822
    paths:
      - .github/workflows/g2b-task8-repro-result-once.yml

permissions:
  contents: read
  issues: write

jobs:
  publish-result:
    if: github.actor == 'leon337'
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 5
    steps:
      - name: Publish existing reproduction result without polling
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          qemu_pid="$(pgrep -f 'qemu-system-x86_64.*g2b-disposable-task8-vm3' | head -1 || true)"
          if [[ -z "$qemu_pid" ]]; then
            report=$'G2B_TASK8_REPRO_RESULT_V1\nQEMU=ABSENT\nREPRO_STATUS=NOT_RECOVERABLE_FROM_GUEST'
          else
            cmdline="$(tr '\0' ' ' <"/proc/$qemu_pid/cmdline")"
            workdir="$(sed -nE 's#.*-pidfile (/tmp/g2b-task8-vm3\.[^ /]+/qemu\.pid).*#\1#p' <<<"$cmdline" | xargs -r dirname)"
            key="$workdir/id_ed25519"
            report="$(ssh -i "$key" -p 22284 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 ubuntu@127.0.0.1 /bin/bash -s <<'GUEST'
          set -u
          echo G2B_TASK8_REPRO_RESULT_V1
          if test -f /home/ubuntu/g2b-task8-repro.status; then printf 'REPRO_STATUS='; cat /home/ubuntu/g2b-task8-repro.status; else echo REPRO_STATUS=ABSENT; fi
          echo REPRO_LOG_TAIL_BEGIN
          if test -f /home/ubuntu/g2b-task8-repro.log; then tail -n 600 /home/ubuntu/g2b-task8-repro.log; else echo REPRO_LOG=ABSENT; fi
          echo REPRO_LOG_TAIL_END
          echo NO_G2B_NODE01_WRITE=PASS
          GUEST
          )"
          fi
          printf '%s\n' "$report"
          python3 - "$report" <<'PY'
          import json, os, sys, urllib.request
          report=sys.argv[1]
          if len(report)>55000: report=report[-55000:]
          body="## G2-B Task 8 reproduction result\n\n```text\n"+report+"\n```"
          req=urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/21/comments",
            data=json.dumps({'body':body}).encode(),
            headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
            method='POST')
          with urllib.request.urlopen(req,timeout=20) as resp: print(resp.status)
          PY
