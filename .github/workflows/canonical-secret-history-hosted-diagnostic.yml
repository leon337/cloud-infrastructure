name: canonical-secret-history-hosted-diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/canonical-secret-history-hosted-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.number == 22 &&
      github.event.pull_request.head.ref == 'team/canonical-state-toolchain-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact diagnostic state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify credential-in-uri history without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import collections, pathlib, re, subprocess

          ROOT = pathlib.Path.cwd()
          MAX = 8 * 1024 * 1024
          URI = re.compile(
              rb"\b(?P<scheme>https?|postgres(?:ql)?|mysql|redis|amqps?)://"
              rb"(?P<user>[^\s/:@]+):(?P<password>[^\s/@]+)@(?P<host>[^\s/:?#]+)",
              re.IGNORECASE,
          )
          MARKERS = (b"user", b"username", b"password", b"passwd", b"pass", b"changeme", b"change-me", b"example", b"placeholder", b"redacted", b"demo", b"test", b"dummy", b"secret")

          def run(*args: str) -> str:
              return subprocess.check_output(args, cwd=ROOT, text=True)

          names = collections.defaultdict(set)
          for line in run("git", "rev-list", "--objects", "--all").splitlines():
              oid, *rest = line.split(" ", 1)
              if rest and rest[0]: names[oid].add(rest[0])

          ids = sorted(set(run("git", "rev-list", "--objects", "--all", "--no-object-names").splitlines()))
          meta = subprocess.check_output(
              ["git", "cat-file", "--batch-check=%(objectname) %(objecttype) %(objectsize)"],
              cwd=ROOT, input="\n".join(ids) + "\n", text=True,
          ).splitlines()

          findings = []
          for line in meta:
              oid, typ, raw_size = line.split()
              if typ != "blob" or int(raw_size) > MAX: continue
              content = subprocess.check_output(["git", "cat-file", "blob", oid], cwd=ROOT)
              matches = list(URI.finditer(content))
              if not matches: continue
              classes, hosts, schemes = [], set(), set()
              for m in matches:
                  user, pwd, host = m.group("user").lower(), m.group("password").lower(), m.group("host").lower()
                  up = any(x in user for x in MARKERS); pp = any(x in pwd for x in MARKERS)
                  if host in {b"localhost", b"127.0.0.1", b"::1"}: hc = "LOCAL"
                  elif host == b"example.com" or host.endswith((b".example", b".example.com", b".test", b".invalid")): hc = "EXAMPLE"
                  else: hc = "OTHER"
                  if up and pp: cc = "PLACEHOLDER_LIKELY"
                  elif hc in {"LOCAL", "EXAMPLE"} and (up or pp): cc = "SYNTHETIC_LIKELY"
                  else: cc = "SUSPICIOUS_REQUIRES_REVIEW"
                  classes.append(cc); hosts.add(hc); schemes.add(m.group("scheme").decode().lower())
              strongest = "SUSPICIOUS_REQUIRES_REVIEW" if "SUSPICIOUS_REQUIRES_REVIEW" in classes else ("SYNTHETIC_LIKELY" if "SYNTHETIC_LIKELY" in classes else "PLACEHOLDER_LIKELY")
              commits = run("git", "log", "--all", "--find-object=" + oid, "--format=%H", "--reverse").splitlines()
              paths = ",".join(sorted(names.get(oid, {"<path-unresolved>"})))
              print(f"HISTORY_CREDENTIAL_FINDING blob={oid} paths={paths} uri_count={len(matches)} classification={strongest} host_class={','.join(sorted(hosts))} scheme={','.join(sorted(schemes))} first_commit={(commits[0] if commits else 'UNRESOLVED')} last_commit={(commits[-1] if commits else 'UNRESOLVED')}")
              findings.append(strongest)

          counts = collections.Counter(findings)
          print(f"HISTORY_CREDENTIAL_SUMMARY total={len(findings)} placeholder_likely={counts['PLACEHOLDER_LIKELY']} synthetic_likely={counts['SYNTHETIC_LIKELY']} suspicious_requires_review={counts['SUSPICIOUS_REQUIRES_REVIEW']}")
          if len(findings) != 9:
              raise SystemExit(f"DIAGNOSTIC_FAIL expected=9 observed={len(findings)}")
          print("HISTORY_CREDENTIAL_HOSTED_DIAGNOSTIC=PASS_REDACTED")
          PY

      - name: Confirm workspace clean
        run: test -z "$(git status --porcelain)"
