name: hermes-relay-refresh

on:
  push:
    branches:
      - mcf/hermes-relay-bootstrap-20260823

permissions:
  contents: read

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, node-01, mcf-control]
    timeout-minutes: 5
    steps:
      - name: Refresh bounded relay without root
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = ubuntu
          if sudo -n true 2>/dev/null; then
            echo 'REFUSED unexpected sudo' >&2
            exit 1
          fi
          base=/home/ubuntu/.local/share/mcf-hermes-relay
          mkdir -p "$base"
          cat > "$base/relay.py" <<'PY'
          import json, os, socket, struct, subprocess

          SOCK='/tmp/mcf-hermes-relay.sock'
          HERMES='/home/ubuntu/.local/bin/hermes'
          ALLOWED_UIDS={994,1000}
          ENV=os.environ.copy()
          ENV.update({
            'HOME':'/home/ubuntu','USER':'ubuntu','LOGNAME':'ubuntu',
            'PATH':'/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin',
            'DISPLAY':':10','XAUTHORITY':'/home/ubuntu/.Xauthority',
            'XDG_RUNTIME_DIR':'/run/user/1000',
            'DBUS_SESSION_BUS_ADDRESS':'unix:path=/run/user/1000/bus'})

          PROBE='Reply with exactly HERMES_READY and nothing else.'
          HELLO='''Execute the first canonical Hermes Operator GUI validation on this Linux VPS. Use ONLY the computer_use toolset and normal visible GUI interaction. Do not use terminal, shell, filesystem APIs, browser APIs, DOM, CDP, backend calls, developer tools, or credentials.

1. Ensure Brave is open; if closed, open it through the GUI.
2. In Brave navigate to https://chatgpt.com through the GUI.
3. If ChatGPT is not already authenticated or asks for login, password, code, or authentication, STOP without entering credentials and return exactly AUTH_REQUIRED.
4. If authenticated, start a new ChatGPT conversation, type exactly: Hello World, send it, and wait until the response is completely finished.
5. Read the entire response, scrolling as needed, and understand it semantically.
6. Open a simple graphical text editor through the GUI.
7. Write a short report in your own words using exactly these headings: MISSÃO, RESPOSTA ENTENDIDA, AVALIAÇÃO, RESULTADO: SUCESSO.
8. Save it as /home/ubuntu/Hermes-Hello-World.txt using the graphical Save/Save As flow.
9. Verify through the GUI that the file is saved and the report content is present.
10. Return a concise final response beginning HELLO_WORLD_GUI_OK:. Do not start any other objective.'''

          OPS={
            'version':([HERMES,'--version'],120),
            'doctor':([HERMES,'doctor'],120),
            'computer_use_status':([HERMES,'computer-use','status'],120),
            'computer_use_doctor':([HERMES,'computer-use','doctor'],120),
            'cognitive_probe':([HERMES,'-z',PROBE,'--ignore-rules'],180),
            'hello_world_gui':([HERMES,'-z',HELLO,'-t','computer_use','--ignore-rules'],480),
          }

          def execute(op):
            if op not in OPS:
              return {'ok':False,'error':'op_not_allowed'}
            cmd,timeout=OPS[op]
            try:
              cp=subprocess.run(cmd,env=ENV,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=timeout)
              return {'ok':cp.returncode==0,'returncode':cp.returncode,'output':cp.stdout[-30000:]}
            except subprocess.TimeoutExpired as e:
              out=e.stdout or ''
              if isinstance(out,bytes): out=out.decode('utf-8','replace')
              return {'ok':False,'error':'timeout','output':out[-30000:]}

          try: os.unlink(SOCK)
          except FileNotFoundError: pass
          srv=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM)
          srv.bind(SOCK); os.chmod(SOCK,0o666); srv.listen(8)
          while True:
            conn,_=srv.accept()
            try:
              _,uid,_=struct.unpack('3i',conn.getsockopt(socket.SOL_SOCKET,socket.SO_PEERCRED,12))
              if uid not in ALLOWED_UIDS:
                conn.sendall(b'{"ok":false,"error":"peer_not_allowed"}\n'); continue
              data=b''
              while b'\n' not in data and len(data)<65536:
                chunk=conn.recv(4096)
                if not chunk: break
                data+=chunk
              try:
                req=json.loads(data.split(b'\n',1)[0].decode())
                result=execute(req.get('op'))
              except Exception as exc:
                result={'ok':False,'error':type(exc).__name__,'detail':str(exc)[:500]}
              conn.sendall((json.dumps(result)+'\n').encode())
            finally:
              conn.close()
          PY
          chmod 700 "$base/relay.py"
          if [[ -f "$base/relay.pid" ]] && kill -0 "$(cat "$base/relay.pid")" 2>/dev/null; then
            kill "$(cat "$base/relay.pid")" || true
            sleep 1
          fi
          rm -f /tmp/mcf-hermes-relay.sock
          env -u RUNNER_TRACKING_ID nohup python3 "$base/relay.py" > "$base/relay.log" 2>&1 < /dev/null &
          echo $! > "$base/relay.pid"
          sleep 2
          test -S /tmp/mcf-hermes-relay.sock
          grep -q hello_world_gui "$base/relay.py"
          echo RELAY_REFRESH_PASS
