name: g2b-sync-local-head

on:
  push:
    branches:
      - ops/r8-task7-syntax-selfhosted-20260822

permissions:
  contents: read

jobs:
  sync:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Fast-forward local G2-B clone to exact remote head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_LOCAL: 1a17bbdcbd833e88cca40309f241f45bf500953d
          EXPECTED_REMOTE: 8e696288cb8f02b79ee130ac7cc5eca42ab6c961
          TARGET_BRANCH: codex/control-bridge-g2b
        run: |
          set -euo pipefail
          repo=/home/ubuntu/cloud-infrastructure
          cd "$repo"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_LOCAL"
          test -z "$(git status --porcelain)"
          auth_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_sha="$(git ls-remote "$auth_url" "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_sha" = "$EXPECTED_REMOTE"
          git fetch --no-tags "$auth_url" "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$EXPECTED_REMOTE"
          git merge --ff-only "refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_REMOTE"
          test -z "$(git status --porcelain)"
          printf 'G2B_LOCAL_SYNCED=%s\n' "$EXPECTED_REMOTE"
