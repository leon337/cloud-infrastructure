name: repository-hygiene-validation

on:
  push:
    branches:
      - sanitization/repository-sanitization
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out integration candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate patch whitespace
        run: git diff --check origin/main...HEAD

      - name: Require canonical repository test entrypoint
        run: |
          if [ ! -x ./scripts/test.sh ]; then
            printf '%s\n' 'BLOCKED: scripts/test.sh is absent from the main-based integration baseline.'
            exit 42
          fi
          ./scripts/test.sh
