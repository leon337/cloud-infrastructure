name: control-bridge-g2b-ci

on:
  pull_request:
  push:
    branches:
      - main
      - codex/control-bridge-g2b
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-bridge-g2b-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock
      - name: Validate repository and disposable contract
        env:
          PYTHON: python
          REQUIRE_ANSIBLE: "1"
        run: |
          scripts/test.sh
          python3 -m unittest tests.test_g2b_disposable_integration -v

  disposable-lifecycle:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove complete G2-B lifecycle in disposable boundary
        env:
          G2B_TEST_PRIVILEGED_CONFIRM: DISPOSABLE_UBUNTU_24_04_ONLY
          G2B_CANDIDATE_SHA: ${{ github.sha }}
        run: scripts/test_control_bridge_g2b_vm.sh

  diagnostic-reproduce:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'leon337' &&
      github.event.pull_request.number == 21 &&
      github.event.pull_request.head.ref == 'team/g2b-task8-20260822'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out frozen attempt-3 candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fbef3d407dbd9b7947b6c100a63d098eaebe2b6a
          fetch-depth: 0
          persist-credentials: false
      - name: Instrument only the ephemeral harness copy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test_control_bridge_g2b_vm.sh')
          text = path.read_text(encoding='utf-8')
          old = """CURRENT_STAGE=apply_g2b
          run_playbook playbooks/apply-control-bridge-g2b.yml >/dev/null
          run_playbook playbooks/apply-control-bridge-g2b.yml >/dev/null
          """
          new = """CURRENT_STAGE=apply_g2b
          printf '%s\\n' 'G2B_DIAG_APPLY_INVOCATION=1'
          run_playbook playbooks/apply-control-bridge-g2b.yml
          printf '%s\\n' 'G2B_DIAG_APPLY_INVOCATION_1=PASS'
          printf '%s\\n' 'G2B_DIAG_APPLY_INVOCATION=2'
          run_playbook playbooks/apply-control-bridge-g2b.yml
          printf '%s\\n' 'G2B_DIAG_APPLY_INVOCATION_2=PASS'
          """
          if text.count(old) != 1:
              raise SystemExit('G2B_DIAG_APPLY_BLOCK_MATCH_FAILED')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- scripts/test_control_bridge_g2b_vm.sh
      - name: Reproduce frozen candidate with complete apply logs
        shell: bash
        env:
          G2B_TEST_PRIVILEGED_CONFIRM: DISPOSABLE_UBUNTU_24_04_ONLY
          G2B_CANDIDATE_SHA: fbef3d407dbd9b7947b6c100a63d098eaebe2b6a
        run: |
          set -o pipefail
          echo 'G2B_TASK8_HOSTED_DIAGNOSTIC_V1'
          echo 'REPRO_NODE01_G2B_WRITE=NOT_EXECUTED'
          scripts/test_control_bridge_g2b_vm.sh 2>&1 | tee g2b-task8-hosted-diagnostic.log
