# Managed by cloud-infrastructure Phase 1 hardening (2026-08-15).
# Keep TCP forwarding for the localhost-only Cloud Workstation tunnel.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding yes
PermitTunnel no
AllowUsers ubuntu
