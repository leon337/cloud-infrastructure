---
- name: Validate Tailscale foundation preconditions
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_release == 'noble'
      - ansible_facts.architecture == 'x86_64'
      - tailscale_package_version | length > 0
      - tailscale_key_sha256 is match('^[0-9a-fA-F]{64}$')
      - tailscale_repo_list_sha256 is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      Tailscale installation is intentionally blocked until the live NODE-01
      precheck passes and the exact package version and upstream file SHA-256
      values are recorded for this slice.

- name: Read an existing Tailscale package version if present
  ansible.builtin.command: dpkg-query -W -f=${Version} tailscale
  register: tailscale_existing_version
  changed_when: false
  failed_when: false

- name: Block an implicit Tailscale upgrade or downgrade
  ansible.builtin.assert:
    that:
      - tailscale_existing_version.rc != 0 or tailscale_existing_version.stdout | trim == tailscale_package_version
    fail_msg: >-
      NODE-01 already has Tailscale {{ tailscale_existing_version.stdout | trim }}
      but this reviewed slice selected {{ tailscale_package_version }}. Stop and
      create an explicit upgrade/downgrade decision with rollback instead of
      silently changing an existing management component.

- name: Ensure Tailscale keyring directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install pinned Tailscale repository signing key
  ansible.builtin.get_url:
    url: "{{ tailscale_key_url }}"
    dest: "{{ tailscale_key_path }}"
    owner: root
    group: root
    mode: '0644'
    checksum: "sha256:{{ tailscale_key_sha256 }}"

- name: Install pinned Tailscale repository definition
  ansible.builtin.get_url:
    url: "{{ tailscale_repo_list_url }}"
    dest: "{{ tailscale_repo_list_path }}"
    owner: root
    group: root
    mode: '0644'
    checksum: "sha256:{{ tailscale_repo_list_sha256 }}"

- name: Install the explicitly selected Tailscale package version
  ansible.builtin.apt:
    name: "tailscale={{ tailscale_package_version }}"
    state: present
    update_cache: true
    allow_downgrade: false

- name: Enable and start tailscaled without enrolling the node
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true
    state: started

- name: Verify no automatic Tailscale enrollment was introduced by this role
  ansible.builtin.command: tailscale status --json
  register: tailscale_install_status
  changed_when: false
  failed_when: false

- name: Report Tailscale enrollment boundary
  ansible.builtin.debug:
    msg: >-
      tailscaled is installed. This role does not run `tailscale up`, does not
      consume an auth key, and does not change the existing OpenSSH fallback.
      Enrollment is a separate HUMAN_GATE-controlled operation.
